<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus contratos | WAND METHOD</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#5a391d55,transparent 40%),#080808;color:#f5f5f5;font:15px Arial,sans-serif;line-height:1.5}header{padding:20px;text-align:center;background:linear-gradient(120deg,#211508,#090909);border-bottom:1px solid #a78643}header img{width:60px}header strong{display:block;color:#f2cf78;letter-spacing:2px}main{max-width:850px;margin:auto;padding:22px 16px 120px}h1,h2{color:#f2cf78}.card{padding:20px;border:1px solid #896c37;border-radius:17px;background:linear-gradient(135deg,#211b13,#111);margin:15px 0}.doc{white-space:pre-wrap;background:#0e0e0e;padding:20px;border:1px solid #62502c;border-radius:12px;max-height:520px;overflow:auto}button{padding:13px 17px;border:0;border-radius:10px;background:linear-gradient(120deg,#ffe3a0,#c69a38);font-weight:bold;margin:10px 8px 4px 0;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#292929;color:#f1d07e;border:1px solid #ae8a45}.muted{color:#bfb8aa}.error{color:#ffb0a9}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(95%,600px);display:flex;justify-content:space-around;background:linear-gradient(130deg,#382812,#080808);border:1px solid #b08a43;border-radius:20px;padding:12px}.dock a{color:#f2ce77;text-decoration:none}@media print{header,.dock,button,.noprint{display:none!important}body{background:white;color:black}.card,.doc{color:black;background:white;border:0;max-height:none}}</style></head><body><header><img src="LogoNova.png" alt=""><strong>WAND METHOD</strong>MEUS CONTRATOS</header><main><a href="aluno.html" style="color:#f2ce77">← Voltar à Minha Ficha</a><h1>Meus contratos</h1><p id="status">Verificando seu cadastro...</p><div id="lista"></div></main><nav class="dock"><a href="aluno.html">⌂ Meu painel</a><a href="contratos-aluno.html">▤ Meus contratos</a></nav><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');const $=id=>document.getElementById(id),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function txt(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}async function carregar(){const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data,error}=await db.rpc('wand_contrato_minhas_propostas');if(error){$('status').className='error';$('status').textContent='Contratos ainda indisponíveis. A configuração segura do Supabase pode estar pendente: '+error.message;return}$('status').textContent='Consulte suas propostas e o documento integral antes de decidir.';const lista=$('lista');lista.replaceChildren();if(!data?.length){lista.append(txt('p','Nenhuma proposta disponível no momento.','muted'));return}for(const p of data){const card=txt('section','','card');card.append(txt('h2',p.modalidade+' — '+p.plano));card.append(txt('p','Mensalidade: '+brl(p.mensalidade)+' | Total: '+brl(p.total)));card.append(txt('p','Situação: '+p.status+' | Pagamento: '+(p.pagamento_confirmado?'confirmado':'pendente')+' | Acesso: '+(p.ativado?'ativado':'aguardando liberação')));card.append(txt('p','Versão: '+p.versao_contrato+' | Identificador do documento: '+p.documento_sha256.slice(0,16)+'…','muted'));const details=document.createElement('details');const sum=txt('summary','Ler documento completo');details.append(sum,txt('div',p.documento_texto,'doc'));card.append(details);const print=document.createElement('button');print.className='secondary';print.textContent='Imprimir / salvar PDF';print.onclick=()=>{details.open=true;window.print()};card.append(print);if(p.status==='enviada'){const note=txt('p','Leia o documento completo antes de aceitar. A decisão será registrada e não poderá ser desfeita nesta tela.','muted');card.append(note);for(const [aceitar,rotulo] of [[true,'Aceito os termos'],[false,'Não aceito']]){const b=document.createElement('button');b.textContent=rotulo;if(!aceitar)b.className='secondary';b.onclick=async()=>{if(!details.open){details.open=true;alert('Leia o contrato completo antes de decidir.');return}if(!confirm(aceitar?'Confirmar aceite deste documento e de seus valores?':'Confirmar recusa desta proposta?'))return;b.disabled=true;const {error}=await db.rpc('wand_contrato_decidir',{p_proposta_id:p.id,p_aceitar:aceitar});if(error){alert('Não foi possível registrar a decisão: '+error.message);b.disabled=false;return}await carregar()};card.append(b)}}lista.append(card)}}carregar();</script></body></html>
