<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus contratos | WAND METHOD — Premium</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#5a391d55,transparent 40%),#080808;color:#f5f5f5;font:15px Arial,sans-serif;line-height:1.5}header{padding:20px;text-align:center;background:linear-gradient(120deg,#211508,#090909);border-bottom:1px solid #a78643}header img{width:60px}header strong{display:block;color:#f2cf78;letter-spacing:2px}main{max-width:850px;margin:auto;padding:22px 16px 120px}h1,h2{color:#f2cf78}.card{padding:20px;border:1px solid #896c37;border-radius:17px;background:linear-gradient(135deg,#211b13,#111);margin:15px 0}.doc{white-space:pre-wrap;background:#0e0e0e;padding:20px;border:1px solid #62502c;border-radius:12px;max-height:520px;overflow:auto}button{padding:13px 17px;border:0;border-radius:10px;background:linear-gradient(120deg,#ffe3a0,#c69a38);font-weight:bold;margin:10px 8px 4px 0;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#292929;color:#f1d07e;border:1px solid #ae8a45}.muted{color:#bfb8aa}.error{color:#ffb0a9}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(95%,600px);display:flex;justify-content:space-around;background:linear-gradient(130deg,#382812,#080808);border:1px solid #b08a43;border-radius:20px;padding:12px}.dock a{color:#f2ce77;text-decoration:none}@media print{header,.dock,button,.noprint{display:none!important}body{background:white;color:black}.card,.doc{color:black;background:white;border:0;max-height:none}}</style><style id="wand-aluno-contratos-premium">
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 85% 0%,#6a4b2428,transparent 48%),#080808;color:#f3f0e9}
header{background:linear-gradient(145deg,#25211c,#0b0b0b 75%);border-bottom:1px solid #65686e;box-shadow:inset 0 1px #ffffff22,0 8px 22px #0008}
main{max-width:780px;padding:24px 18px 145px}
h1{font-size:clamp(25px,5vw,34px);margin:25px 0 12px}
#status{color:#c4c1ba;line-height:1.65;margin-bottom:22px}
.card{padding:clamp(20px,4vw,30px);background:linear-gradient(150deg,#30302e 0%,#1b1b1b 27%,#111 78%,#211b14 100%);border:1px solid #a2a6ae;border-radius:23px;box-shadow:inset 0 2px 1px #ffffff6b,inset 0 -4px 10px #c19a3530,0 15px 30px #000a,0 0 18px #c69a3020;margin:20px 0 28px}

.contract-head{display:flex;align-items:center;gap:13px;margin-bottom:18px}

button.secondary{background:linear-gradient(145deg,#383630,#181818 65%,#2d251b);border:1px solid #a2a7b0;color:#f4d18c;box-shadow:inset 0 2px #ffffff64,inset 0 -3px 7px #ae8b3836,0 7px 13px #0009}
.contract-note{font-size:13px;color:#c5c0b7;line-height:1.6;margin:18px 0 12px}

@media print{body{background:#fff!important;color:#000!important}.card{background:#fff!important;color:#000!important;border:0!important;box-shadow:none!important}.contract-summary,.contract-progress,.contract-meta,.contract-actions,.contract-note,.contract-head,.dock,header,main>a,#status{display:none!important}.contract-details{border:0!important;box-shadow:none!important}.contract-details summary{display:none!important}.doc{background:#fff!important;color:#000!important;max-height:none!important;overflow:visible!important;border:0!important;padding:0!important;margin:0!important;white-space:pre-wrap!important}}
</style><style>.contract-consent{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;margin:16px 0;border:1px solid #777d86;border-radius:14px;background:linear-gradient(145deg,#252525,#121212);color:#f0e8d8;line-height:1.5;font-size:14px;cursor:pointer}.contract-consent input{flex:none;width:21px;height:21px;margin-top:2px;accent-color:#d4a83e}.contract-consent span{flex:1}.contract-consent-hint{color:#c6c1b6;font-size:13px;margin:0 0 14px;line-height:1.5}.contract-actions button:disabled{opacity:.42;filter:grayscale(1);cursor:not-allowed;transform:none!important;box-shadow:none!important}</style><style id="wand-voltar-premium">.wand-voltar,.back-btn,.actions a.button.secondary[href="admin.html"],.actions a.button.secondary[href="aluno.html"]{display:inline-flex!important;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:11px 17px!important;margin:10px 0 18px;text-decoration:none!important;color:#f4d28b!important;font-weight:650!important;font-size:14px!important;line-height:1.35;border:1px solid #a8adb5!important;border-radius:13px!important;background:linear-gradient(145deg,#3b3935 0%,#191919 55%,#292115 100%)!important;box-shadow:inset 0 2px 1px #ffffff69,inset 0 -3px 6px #bc933c40,0 6px 13px #000a!important;cursor:pointer;transition:transform .15s,filter .15s}.wand-voltar:hover,.back-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.wand-voltar:focus-visible,.back-btn:focus-visible{outline:2px solid #f4d28b;outline-offset:3px}@media(max-width:440px){.wand-voltar,.back-btn{font-size:13px!important}}@media print{.wand-voltar,.back-btn{display:none!important}}</style></head><body><header><img src="LogoNova.png" alt=""><strong>WAND METHOD</strong>MEUS CONTRATOS</header><main><a class="wand-voltar" href="aluno.html">← Voltar à Minha Ficha</a><h1>Meus contratos</h1><p id="status">Verificando seu cadastro...</p><div id="lista"></div></main><nav class="dock"><a href="aluno.html">⌂ Meu painel</a><a href="contratos-aluno.html">▤ Meus contratos</a></nav><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');const $=id=>document.getElementById(id),brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function txt(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}async function carregar(){const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data,error}=await db.rpc('wand_contrato_minhas_propostas');if(error){$('status').className='error';$('status').textContent='Contratos ainda indisponíveis. A configuração segura do Supabase pode estar pendente: '+error.message;return}$('status').textContent='Consulte suas propostas e o documento integral antes de decidir.';const lista=$('lista');lista.replaceChildren();if(!data?.length){lista.append(txt('p','Nenhuma proposta disponível no momento.','muted'));return}for(const p of data){const card=txt('section','','card');const head=txt('div','','contract-head');head.append(txt('span','▤','contract-symbol'));const heading=txt('h2',p.modalidade+' — '+(p.plano==='pacote'?'Pacote de aulas':p.plano));head.append(heading);card.append(head);
const metricas=txt('div','','contract-summary');for(const [rotulo,valor] of [[p.plano==='pacote'?'Valor do pacote':'Mensalidade',brl(p.mensalidade)],['Valor total',brl(p.total)]]){const m=txt('div','','contract-metric');m.append(txt('small',rotulo),txt('strong',valor));metricas.append(m)}card.append(metricas);
const progresso=txt('div','','contract-progress');const statusMap={enviada:'Aguardando sua decisão',aceita:'Contrato aceito',recusada:'Proposta recusada',substituida:'Proposta substituída'};progresso.append(txt('p','Contrato: '));progresso.lastChild.append(txt('strong',statusMap[p.status]||p.status));progresso.append(txt('p','Pagamento: '+(p.pagamento_confirmado?'Confirmado':'Aguardando confirmação')));progresso.append(txt('p','Acesso ao aplicativo: '+(p.ativado?'Liberado':'Aguardando liberação pelo treinador')));card.append(progresso);
const details=document.createElement('details');details.className='contract-details';const sum=txt('summary','Visualizar contrato completo');details.append(sum,txt('div',p.documento_texto,'doc'));card.append(details);
const actions=txt('div','','contract-actions');const print=document.createElement('button');print.className='secondary';print.textContent='Imprimir / salvar PDF';print.onclick=()=>{details.open=true;window.print()};actions.append(print);card.append(actions);
card.append(txt('p','Versão '+p.versao_contrato+' · Registro digital '+String(p.documento_sha256||'').slice(0,16)+'…','contract-meta'));
if(p.status==='enviada'){card.append(txt('p','Leia o contrato completo antes de decidir. Sua resposta será registrada no sistema.','contract-note'));const decisoes=txt('div','','contract-actions');const confirmacao=txt('label','','contract-consent');const caixa=document.createElement('input');caixa.type='checkbox';caixa.setAttribute('aria-label','Declaro que li e aceito os termos do contrato completo');confirmacao.append(caixa,txt('span','Declaro que li o contrato completo e aceito seus termos e condições.'));card.append(confirmacao);const avisoAceite=txt('p','Marque a declaração acima para habilitar o botão de aceite.','contract-consent-hint');card.append(avisoAceite);for(const [aceitar,rotulo] of [[true,'Li e aceito os termos'],[false,'Não aceito']]){const b=document.createElement('button');b.textContent=rotulo;if(!aceitar)b.className='secondary';if(aceitar){b.disabled=true;caixa.addEventListener('change',()=>{b.disabled=!caixa.checked;avisoAceite.textContent=caixa.checked?'Declaração marcada. Você pode confirmar o aceite.':'Marque a declaração acima para habilitar o botão de aceite.'})}b.onclick=async()=>{if(!details.open){details.open=true;details.scrollIntoView({behavior:'smooth',block:'start'});alert('Leia o contrato completo antes de decidir.');return}if(aceitar&&!caixa.checked){alert('Marque a declaração de leitura e aceite para continuar.');return}if(!confirm(aceitar?'Confirmo que li o contrato completo e aceito seus termos, condições e valores. Deseja registrar meu aceite?':'Confirmar recusa desta proposta?'))return;b.disabled=true;const {error}=await db.rpc('wand_contrato_decidir',{p_proposta_id:p.id,p_aceitar:aceitar});if(error){alert('Não foi possível registrar a decisão: '+error.message);b.disabled=false;return}await carregar()};decisoes.append(b)}card.append(decisoes)}lista.append(card)}}carregar();</script></body></html>
