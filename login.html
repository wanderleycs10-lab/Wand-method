<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Entrar | WAND METHOD</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;min-height:100dvh;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}.card{width:100%;max-width:420px;background:#151515;border:1px solid #695729;border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 12px 45px #0008}.logo{width:100px;height:100px;object-fit:contain;display:block;margin:0 auto 12px}.brand{font-size:27px;letter-spacing:2px;font-weight:700;margin:0}.gold{color:#d4af37}.silver{color:#c0c0c0}.subtitle{color:#bbb;font-size:14px;line-height:1.5;margin:12px 0 28px}h2{font-size:19px;margin:0 0 22px}.field{text-align:left;margin-bottom:16px}.field label{display:block;font-size:13px;color:#ddd;margin-bottom:7px}.field input{display:block;width:100%;height:50px;border-radius:9px;border:1px solid #5c5c5c;background:#252525;color:#fff;font:inherit;padding:0 14px;outline-offset:3px}.field input:focus{border-color:#d4af37;outline:1px solid #d4af37}.password-wrap{position:relative}.password-wrap input{padding-right:58px}.eye{position:absolute;right:6px;top:5px;width:40px;height:40px;padding:8px;display:grid;place-items:center;border:0;border-radius:8px;background:transparent;color:#d4af37;cursor:pointer}.eye:focus-visible{outline:2px solid #d4af37}.submit{width:100%;height:50px;border:0;border-radius:9px;background:#d4af37;color:#080808;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}.submit:disabled{opacity:.6;cursor:wait}#mensagem{min-height:23px;color:#ffb4b4;font-size:14px;line-height:1.45;margin:15px 0}a{color:#d4af37;font-size:14px}.footer{margin-top:18px;font-size:11px;color:#888}@media(max-width:390px){.card{padding:25px 18px}.brand{font-size:24px}}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="LogoNova.png" alt="Logo WAND METHOD">
<h1 class="brand"><span class="gold">WAND</span> <span class="silver">METHOD</span></h1>
<p class="subtitle">Seu treino. Sua evolução. Seu método.</p>
<h2>Acesse sua conta</h2>
<form id="formLogin">
<div class="field"><label for="email">E-mail</label><input id="email" type="email" placeholder="Seu e-mail" autocomplete="username" required></div>
<div class="field"><label for="senha">Senha</label><div class="password-wrap"><input id="senha" type="password" placeholder="Sua senha" autocomplete="current-password" required minlength="8"><button type="button" class="eye" id="mostrarSenha" aria-label="Mostrar senha" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="riscoOlho" d="M3 3l18 18" style="display:none"/></svg></button></div></div>
<button id="entrar" class="submit" type="submit">ENTRAR</button>
</form>
<p id="mensagem" role="status" aria-live="polite"></p>
<a href="index.html">← Voltar ao início</a>
<p class="footer">WAND METHOD © 2026</p>
</main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const form=document.getElementById('formLogin');
const botao=document.getElementById('entrar');
const mensagem=document.getElementById('mensagem');
const senha=document.getElementById('senha');
const olho=document.getElementById('mostrarSenha');
const risco=document.getElementById('riscoOlho');
olho.addEventListener('click',()=>{const mostrar=senha.type==='password';senha.type=mostrar?'text':'password';risco.style.display=mostrar?'block':'none';olho.setAttribute('aria-label',mostrar?'Ocultar senha':'Mostrar senha');olho.setAttribute('aria-pressed',String(mostrar));});
function aviso(texto,erro=true){mensagem.style.color=erro?'#ffb4b4':'#d4af37';mensagem.textContent=texto;}
async function destinoDoUsuario(user){
  const {data:perfil,error:perfilError}=await supabase.from('profiles').select('role').eq('id',user.id).single();
  if(perfilError||!perfil)throw new Error('Não foi possível verificar seu perfil. Entre em contato com o suporte.');
  if(perfil.role==='admin')return 'admin.html';
  // Alunos usam a página que restaura automaticamente a sessão de treino.
  // Mantém o comportamento atual para demais perfis não administrativos.
  return 'aluno.html';
}
form.addEventListener('submit',async evento=>{
 evento.preventDefault();if(botao.disabled)return;
 botao.disabled=true;aviso('Verificando acesso...',false);
 try{
  const email=document.getElementById('email').value.trim();
  const password=senha.value;
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){aviso('Não foi possível entrar. Confira seu e-mail e sua senha.');return;}
  aviso('Verificando permissões...',false);
  const {data:{user},error:userError}=await supabase.auth.getUser();
  if(userError||!user)throw new Error('Não foi possível verificar sua conta.');
  const destino=await destinoDoUsuario(user);
  window.location.replace(destino);
 }catch(e){console.error('Falha no acesso:',e);aviso(e.message||'Não foi possível concluir o acesso. Tente novamente.');}
 finally{botao.disabled=false;}
});
</script>
</body>
</html>
