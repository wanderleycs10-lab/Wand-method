
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Biblioteca de Exercícios | WAND METHOD</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      border-bottom: 1px solid #d4af37;
    }

    header h1 {
      color: #d4af37;
      margin: 0 0 8px;
    }

    header p {
      color: #aaa;
      margin: 0;
      font-size: 13px;
      letter-spacing: 2px;
    }

    main {
      max-width: 1050px;
      margin: auto;
      padding: 24px 16px;
    }

    h2 { color: #d4af37; }

    .voltar {
      display: inline-block;
      color: #d4af37;
      text-decoration: none;
      margin-bottom: 20px;
    }

    .painel {
      background: #171717;
      border: 1px solid #66551f;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filtros {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    input, select {
      width: 100%;
      background: #242424;
      color: white;
      border: 1px solid #66551f;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: 1px solid #d4af37;
    }

    .contador {
      margin: 20px 0;
      color: #bbb;
    }

    .grade {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .exercicio {
      background: #171717;
      border: 1px solid #4a401f;
      border-radius: 14px;
      padding: 20px;
    }

    .exercicio h3 {
      color: #d4af37;
      margin-top: 0;
    }

    .exercicio p {
      color: #ccc;
      font-size: 14px;
      line-height: 1.5;
    }

    .etiqueta {
      display: inline-block;
      background: #302818;
      color: #f0c65c;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    button {
      background: #d4af37;
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #f0c65c; }

    .detalhes {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #444;
    }

    .detalhes.aberto { display: block; }

    .vazio {
      color: #bbb;
      text-align: center;
      padding: 25px;
    }

    #conteudo { display: none; }

    @media (max-width: 650px) {
      .filtros {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>WAND METHOD</h1>
    <p>WAND EXERCISES</p>
  </header>

  <main>
    <a href="admin.html" class="voltar">
      ← Voltar ao WandCoach
    </a>

    <p id="status">Verificando acesso...</p>

    <div id="conteudo">
      <h2>Biblioteca de Exercícios</h2>

      <div class="painel">
        <div class="filtros">
          <input
            type="search"
            id="pesquisa"
            placeholder="Pesquisar exercício..."
            aria-label="Pesquisar exercício"
          >

          <select id="grupo">
            <option value="">Todos os músculos</option>
          </select>

          <select id="equipamento">
            <option value="">Todos os equipamentos</option>
          </select>
        </div>
      </div>

      <p class="contador" id="contador"></p>

      <div id="lista" class="grade"></div>
    </div>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://kvxdnreipuahoaostlle.supabase.co",
      "sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo"
    );

    const status = document.getElementById("status");
    const conteudo = document.getElementById("conteudo");
    const lista = document.getElementById("lista");
    const contador = document.getElementById("contador");
    const pesquisa = document.getElementById("pesquisa");
    const grupo = document.getElementById("grupo");
    const equipamento =
      document.getElementById("equipamento");

    let exercicios = [];

    async function verificarAcesso() {
      const { data: { user }, error } =
        await supabase.auth.getUser();

      if (error || !user) {
        window.location.replace("login.html");
        return;
      }

      const { data: perfil, error: erroPerfil } =
        await supabase
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .single();

      if (erroPerfil || perfil?.role !== "admin") {
        status.textContent = "Acesso não autorizado.";
        return;
      }

      conteudo.style.display = "block";
      status.textContent = "";

      await carregarExercicios();
    }

    async function carregarExercicios() {
      status.textContent = "Carregando exercícios...";

      const { data, error } = await supabase
        .from("wand_exercicios")
        .select("*")
        .eq("ativo", true)
        .order("nome", { ascending: true });

      if (error) {
        console.error(error);
        status.textContent =
          "Não foi possível carregar os exercícios.";
        return;
      }

      exercicios = data || [];

      preencherFiltros();
      mostrarExercicios();

      status.textContent = "";
    }

    function preencherFiltros() {
      const grupos = [...new Set(
        exercicios.map(e => e.grupo_muscular)
          .filter(Boolean)
      )].sort();

      const equipamentos = [...new Set(
        exercicios.map(e => e.equipamento)
          .filter(Boolean)
      )].sort();

      grupos.forEach(nome => {
        const opcao = document.createElement("option");
        opcao.value = nome;
        opcao.textContent = nome;
        grupo.appendChild(opcao);
      });

      equipamentos.forEach(nome => {
        const opcao = document.createElement("option");
        opcao.value = nome;
        opcao.textContent = nome;
        equipamento.appendChild(opcao);
      });
    }

    function mostrarExercicios() {
      const termo = pesquisa.value
        .trim()
        .toLocaleLowerCase("pt-BR");

      const filtrados = exercicios.filter(e => {
        const nome = (e.nome || "")
          .toLocaleLowerCase("pt-BR");

        return (
          nome.includes(termo) &&
          (!grupo.value ||
            e.grupo_muscular === grupo.value) &&
          (!equipamento.value ||
            e.equipamento === equipamento.value)
        );
      });

      lista.replaceChildren();

      contador.textContent =
        filtrados.length + " exercício(s) encontrado(s)";

      if (filtrados.length === 0) {
        const vazio = document.createElement("p");
        vazio.className = "vazio";
        vazio.textContent =
          "Nenhum exercício encontrado.";
        lista.appendChild(vazio);
        return;
      }

      filtrados.forEach(exercicio => {
        const card = document.createElement("article");
        card.className = "exercicio";

        const titulo = document.createElement("h3");
        titulo.textContent = exercicio.nome;

        const etiqueta = document.createElement("span");
        etiqueta.className = "etiqueta";
        etiqueta.textContent =
          exercicio.grupo_muscular || "Não informado";

        const info = document.createElement("p");
        info.textContent =
          "Equipamento: " +
          (exercicio.equipamento || "Não informado") +
          " | Nível: " +
          (exercicio.dificuldade || "Não informado");

        const botao = document.createElement("button");
        botao.type = "button";
        botao.textContent = "Ver detalhes";

        const detalhes = document.createElement("div");
        detalhes.className = "detalhes";

        const instrucoes = document.createElement("p");
        instrucoes.textContent =
          "Execução: " +
          (exercicio.instrucoes ||
            "Instruções ainda não cadastradas.");

        const erros = document.createElement("p");
        erros.textContent =
          "Erros comuns: " +
          (exercicio.erros_comuns ||
            "Não informados.");

        const secundarios = document.createElement("p");
        secundarios.textContent =
          "Músculos secundários: " +
          (exercicio.musculos_secundarios ||
            "Não informados.");

        detalhes.append(
          instrucoes,
          erros,
          secundarios
        );

        botao.addEventListener("click", () => {
          const aberto =
            detalhes.classList.toggle("aberto");

          botao.textContent =
            aberto ? "Ocultar detalhes" : "Ver detalhes";
        });

        card.append(
          titulo,
          etiqueta,
          info,
          botao,
          detalhes
        );

        lista.appendChild(card);
      });
    }

    pesquisa.addEventListener(
      "input", mostrarExercicios
    );

    grupo.addEventListener(
      "change", mostrarExercicios
    );

    equipamento.addEventListener(
      "change", mostrarExercicios
    );

    verificarAcesso();
  </script>
</body>
</html>
