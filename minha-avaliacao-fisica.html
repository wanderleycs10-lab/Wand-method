<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minhas Medidas | WAND METHOD</title><link rel="stylesheet" href="./wand-premium.css?v=design-3"><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:15px Arial,sans-serif}header{text-align:center;border-bottom:1px solid #66551f;padding:22px}h1,h2{color:#d4af37}main{max-width:750px;margin:auto;padding:20px}.card{border:1px solid #66551f;border-radius:14px;padding:20px;background:#171717;margin:16px 0}label{display:block;margin:16px 0}input{display:block;width:100%;padding:12px;background:#111;color:#fff;border:1px solid #76612d;border-radius:8px;margin-top:8px}button,a.btn{display:block;width:100%;background:#d4af37;color:#111;border:0;border-radius:9px;padding:14px;text-align:center;text-decoration:none;font-weight:bold;cursor:pointer;margin:14px 0}.muted{color:#bbb;line-height:1.6}.error{color:#ff8585}.success{color:#8fdb9d}details{border:1px solid #524622;border-radius:9px;padding:12px;margin:12px 0}summary{color:#f2d16e;cursor:pointer}summary+div{margin-top:12px}</style><link rel="stylesheet" href="./wand-navigation.css?v=1"></head><body data-wand-level="2"><header><h1>WAND METHOD</h1><p>MINHA AVALIAÇÃO FÍSICA</p></header><main><a class="btn" href="aluno.html#avaliacoes" data-wand-back>Voltar para Avaliações</a><h2>Medidas corporais</h2><p class="muted">Preencha apenas as medidas solicitadas. Não faça dobras cutâneas. Utilize uma fita métrica flexível, sem apertar a pele, e registre em centímetros.</p><div id="status" role="status">Verificando solicitações…</div><div id="requests"></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const status=document.getElementById('status'),requests=document.getElementById('requests');
const measures=[['peso','Peso (kg)','Pese-se, de preferência, na mesma balança, em condições semelhantes.'],['cintura','Cintura (cm)','Em pé, abdômen relaxado, passe a fita horizontalmente ao redor da cintura, sem apertar.'],['quadril','Quadril (cm)','Meça a maior circunferência da região dos glúteos, mantendo a fita nivelada.'],['braco_direito','Braço direito (cm)','Com o braço direito relaxado ao lado do corpo, meça a circunferência no ponto médio do braço.'],['braco_esquerdo','Braço esquerdo (cm)','Repita a medição no braço esquerdo, com a mesma técnica.'],['coxa_direita','Coxa direita (cm)','Em pé, meça a coxa direita em um ponto fixo, no meio entre o quadril e o joelho.'],['coxa_esquerda','Coxa esquerda (cm)','Repita na coxa esquerda usando o mesmo ponto anatômico.']];
async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data,error}=await db.rpc('wand_aluno_avaliacoes_pendentes');if(error)throw error;status.textContent='';if(!data?.length){status.textContent='Nenhuma avaliação física pendente no momento.';return}for(const request of data){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent='Avaliação solicitada';section.append(h);const form=document.createElement('form');for(const [key,label,guide] of measures){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Como medir: '+label;details.append(summary);const p=document.createElement('div');p.textContent=guide;details.append(p);form.append(details);const field=document.createElement('label');field.textContent=label;const input=document.createElement('input');input.type='number';input.name=key;input.min='0.01';input.max='500';input.step='0.01';input.inputMode='decimal';field.append(input);form.append(field)}const b=document.createElement('button');b.textContent='Enviar medidas para o treinador';b.type='submit';form.append(b);const feedback=document.createElement('p');feedback.setAttribute('role','status');form.append(feedback);form.onsubmit=async e=>{e.preventDefault();const medidas={};for(const [key] of measures){const v=form.elements[key].value.trim();if(v){const n=Number(v);if(!Number.isFinite(n)||n<=0||n>500){feedback.className='error';feedback.textContent='Confira a medida: '+key.replaceAll('_',' ');return}medidas[key]=n}}if(!Object.keys(medidas).length){feedback.className='error';feedback.textContent='Preencha ao menos uma medida.';return}b.disabled=true;const {error:err}=await db.rpc('wand_enviar_avaliacao_aluno',{p_solicitacao_id:request.id,p_medidas:medidas});if(err){feedback.className='error';feedback.textContent=err.message;b.disabled=false;return}section.replaceChildren();const success=document.createElement('p');success.className='success';success.textContent='Medidas enviadas! Aguarde a revisão do treinador.';section.append(success);await wandMostrarConclusao(success.textContent)};section.append(form);requests.append(section)}}catch(e){status.className='error';status.textContent='Não foi possível consultar as solicitações: '+e.message}}init();
</script><script src="./wand-navigation.js?v=design-3" data-profile="student"></script></body></html>
