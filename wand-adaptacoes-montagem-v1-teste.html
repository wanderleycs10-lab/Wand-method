<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Montagem de adaptações | WAND METHOD</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font:16px Arial}main{max-width:900px;margin:auto;padding:24px 16px}h1,h2{color:#d4af37}.card{background:#171717;border:1px solid #66551f;border-radius:14px;padding:20px;margin:14px 0}.info{color:#bbb;line-height:1.5}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}button,.btn{background:#d4af37;color:#080808;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.5}.sec{background:#303030;color:#fff;border:1px solid #66551f}.error{color:#ff9999}.ok{color:#83e29c}a{color:#d4af37}</style></head><body><main><h1>WAND METHOD · Treinos adaptados</h1><p class="info">Uma adaptação para cada ficha do programa. A cópia é independente e começa como rascunho; não altera a prescrição original.</p><p id="status">Verificando acesso...</p><section id="app" hidden><h2 id="titulo"></h2><div id="fichas"></div><p id="mensagem" role="status"></p><a id="voltar" class="btn sec" href="admin.html">Voltar ao perfil do aluno</a></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),programaId=p.get('programa_id');let user,programa;
const uuid=x=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x||'');
function el(tag,txt='',cl=''){const e=document.createElement(tag);e.textContent=txt;if(cl)e.className=cl;return e}
async function iniciar(){try{if(!uuid(programaId))throw Error('Abra esta página após publicar um programa válido.');const auth=await sb.auth.getUser();user=auth.data.user;if(auth.error||!user){location.replace('login.html');return}const perfil=await sb.from('profiles').select('role').eq('id',user.id).single();if(perfil.error||perfil.data?.role!=='admin')throw Error('Acesso exclusivo do treinador.');const pr=await sb.from('wand_programas_treino').select('id,aluno_id,nome,status,treinador_id').eq('id',programaId).eq('treinador_id',user.id).single();if(pr.error)throw pr.error;programa=pr.data;$('titulo').textContent=programa.nome;$('voltar').href='perfil-aluno.html?id='+encodeURIComponent(programa.aluno_id)+'&aba=treinos';const fs=await sb.from('wand_programa_fichas').select('ordem,codigo,treino_id').eq('programa_id',programaId).order('ordem');if(fs.error)throw fs.error;const ids=fs.data.map(x=>x.treino_id);const ts=await sb.from('wand_treinos').select('id,nome,status,validade_inicio,validade_fim,aluno_id,treinador_id').in('id',ids);if(ts.error)throw ts.error;const treinos=new Map(ts.data.map(x=>[x.id,x]));for(const f of fs.data){const t=treinos.get(f.treino_id);if(!t)continue;const card=el('article','','card');card.append(el('h2','Treino '+f.codigo+' → Adaptado '+f.codigo),el('p',t.nome+' · validade até '+(t.validade_fim||'não definida'),'info'));const btn=el('button','Criar rascunho adaptado');const feedback=el('p','','info');btn.onclick=async()=>{btn.disabled=true;feedback.textContent='Criando cópia...';try{if(t.status!=='ativo')throw Error('A ficha original precisa estar ativa.');const hoje=new Date().toLocaleDateString('en-CA');if(t.validade_fim&&t.validade_fim<hoje)throw Error('A ficha original já venceu.');const nome='Adaptado '+f.codigo+' · '+t.nome;const r=await sb.rpc('wand_duplicar_treino',{p_treino_id:t.id,p_aluno_destino_id:programa.aluno_id,p_nome_novo:nome});if(r.error)throw r.error;const novo=typeof r.data==='string'?r.data:r.data?.id||r.data?.treino_id;if(!uuid(novo))throw Error('Cópia criada, mas não foi possível identificar o ID. Confira Rascunhos antes de repetir.');const upd=await sb.from('wand_treinos').update({validade_inicio:t.validade_inicio,validade_fim:t.validade_fim}).eq('id',novo).eq('aluno_id',programa.aluno_id).eq('treinador_id',user.id).eq('status','rascunho').select('id').single();if(upd.error)throw upd.error;const link=el('a','Editar adaptação '+f.codigo,'btn');link.href='prescricao-treinos-integrada-v1-teste.html?treino_id='+encodeURIComponent(novo)+'&aluno_id='+encodeURIComponent(programa.aluno_id);card.append(link);feedback.textContent='Rascunho criado com validade sincronizada. Edite a cópia antes de disponibilizar.';feedback.className='ok';btn.remove();}catch(e){feedback.textContent='Não foi possível concluir: '+e.message;feedback.className='error';btn.disabled=false}};card.append(btn,feedback);$('fichas').append(card)}$('status').textContent='';$('app').hidden=false;}catch(e){$('status').textContent='Erro: '+e.message;$('status').className='error'}}iniciar();
</script></body></html>
