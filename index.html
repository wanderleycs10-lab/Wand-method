
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WAND METHOD</title>

  <!-- Configuração do aplicativo -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    main {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .logo {
      display: block;
      width: 260px;
      max-width: 85%;
      height: auto;
      margin: 0 auto 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: 3px;
    }

    .dourado {
      color: #d4af37;
    }

    .prata {
      color: #c0c0c0;
    }

    .subtitulo {
      color: #d4af37;
      font-size: 12px;
      letter-spacing: 3px;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    .frase {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .descricao {
      color: #cccccc;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .botao {
      display: block;
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      transition: background 0.2s;
    }

    .botao-principal {
      background: #d4af37;
      color: #080808;
    }

    .botao-secundario {
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
    }

    .rodape {
      margin-top: 35px;
      color: #888888;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main>

    <img
      src="./identidade-wand-method.png"
      alt="Logo WAND METHOD"
      class="logo"
      onerror="this.onerror=null;this.src='./LogoNova.png';"
    >

    <h1>
      <span class="dourado">WAND</span>
      <span class="prata">METHOD</span>
    </h1>

    <div class="subtitulo">
      CONSULTORIA PRESENCIAL E ONLINE
    </div>

    <p class="frase">
      Seu treino. Sua evolução. Seu método.
    </p>

    <p class="descricao">
      Treinamento personalizado,
      acompanhamento profissional
      e resultados com estratégia.
    </p>

    <a
      href="./login.html"
      class="botao botao-principal"
    >
      ENTRAR NO WAND METHOD
    </a>

    <a
      href="https://wa.me/5521982212876?text=Ol%C3%A1%21%20Conheci%20o%20WAND%20METHOD%20e%20gostaria%20de%20saber%20mais%20sobre%20a%20consultoria."
      class="botao botao-secundario"
    >
      CONHECER A CONSULTORIA
    </a>

    <p class="rodape">
      TREINE COM ESTRATÉGIA.
      EVOLUA COM PROPÓSITO.
    </p>

  </main>

  <script src="./pwa-init.js" defer></script>

</body>
</html>
