<body>
  <main>
    <div class="wand-brand"><img src="LogoNova.png" alt="Logo WAND METHOD"><div><h1>WAND METHOD</h1><p>WANDCOACH · CADASTRO DE ALUNO</p></div></div>
    <a class="wand-voltar" href="admin.html#wc/alunos">← Voltar para Meus Alunos</a>

    <div class="card">
      <h2>Novo aluno</h2>

      <form id="formAluno">
        <label for="nome">Nome completo</label>
        <input id="nome" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" required>

<label for="whatsapp">WhatsApp com DDD</label>
<input
  id="whatsapp"
  name="whatsapp"
  type="tel"
  placeholder="(21) 99999-9999"
  autocomplete="tel"
  maxlength="15"
  required
>

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" type="date" required>

        <label for="sexo">Sexo</label>
        <select id="sexo" required>
          <option value="">Selecione</option>
          <option value="feminino">Feminino</option>
          <option value="masculino">Masculino</option>
          <option value="outro">Outro</option>
          <option value="nao_informado">Prefiro não informar</option>
        </select>

        <label for="modalidade">Modalidade</label>
        <select id="modalidade" required>
          <option value="">Selecione</option>
          <option value="online">Online</option>
          <option value="presencial">Presencial</option>
          <option value="semipresencial">Semipresencial</option>
        </select>

        <button type="submit">Cadastrar aluno</button>
      </form>

      <p id="mensagem" class="aviso">
        Preencha os dados e confirme para cadastrar o aluno.
      </p>
    </div>

    <a class="wand-voltar" href="admin.html#wc/alunos">← Voltar para Meus Alunos</a>
  </main><nav class="wand-cadastro-dock" aria-label="Navegação do WandCoach"><a href="admin.html"><span aria-hidden="true">⌂</span><small>Início</small></a><a href="admin.html#wc/alunos"><span aria-hidden="true">♙</span><small>Meus Alunos</small></a><a href="cadastro-aluno.html" aria-current="page"><span aria-hidden="true">＋</span><small>Cadastrar</small></a></nav>

  
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://kvxdnreipuahoaostlle.supabase.co";
const SUPABASE_KEY = "sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

document.getElementById("formAluno")
  .addEventListener("submit", async (event) => {
    event.preventDefault();

    const mensagem = document.getElementById("mensagem");
    mensagem.textContent = "Salvando aluno...";

    const { data: { user }, error: authError } =
      await supabase.auth.getUser();

    if (authError || !user) {
      mensagem.textContent = "Faça login antes de cadastrar um aluno.";
      return;
    }

    const { data: perfil, error: perfilError } = await supabase
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

    if (perfilError || perfil?.role !== "admin") {
      mensagem.textContent = "Apenas administradores podem cadastrar alunos.";
      return;
    }

    const aluno = {
      nome_completo: document.getElementById("nome").value.trim(),
      email: document.getElementById("email").value.trim(),
      whatsapp: document.getElementById("whatsapp").value.trim(),
      data_nascimento: document.getElementById("nascimento").value,
      sexo: document.getElementById("sexo").value,
      modalidade: document.getElementById("modalidade").value
    };

    const { error } = await supabase
      .from("alunos")
      .insert(aluno);

    if (error) {
      mensagem.textContent = "Erro ao cadastrar: " + error.message;
      return;
    }

    mensagem.textContent = "Aluno cadastrado com sucesso!";
    document.getElementById("formAluno").reset();
  });
</script>

</body>
