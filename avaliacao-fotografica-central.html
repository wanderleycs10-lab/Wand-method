<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Fotográfica · WandCoach</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 10%,#51350f60,transparent 35%),#080808;color:#f5f5f5;font:15px Arial,sans-serif}main{max-width:820px;margin:auto;padding:22px 16px 120px}h1,h2{color:#f0c76c}h1{font-size:25px}h2{font-size:19px}.muted,small{color:#bfb9ad;line-height:1.5}.back{width:auto!important;background:transparent!important;color:#d4af37!important;border:1px solid #a88b32!important;border-radius:15px!important;box-shadow:none!important;padding:12px 15px!important;font-size:14px}.card,button.action{border:1px solid #94753c;border-radius:18px;background:linear-gradient(135deg,#31230e,#181818 40%,#151515 80%,#2c1e0c);box-shadow:inset 0 1px #e7c57d52,0 9px 19px #0008;padding:17px;margin:13px 0}.action{display:flex;align-items:center;gap:14px;text-align:left;width:100%;color:white;cursor:pointer;font:inherit;min-height:85px}.action .symbol{display:grid;place-items:center;width:45px;height:45px;flex-shrink:0;border:1px solid #a88b32;border-radius:13px;color:#f0c76c;background:#382910;font-size:25px}.action .copy{flex:1}.action strong,.action small{display:block}.action strong{font-size:16px}.action small{margin-top:5px}.count{display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px;padding:5px 10px;border-radius:10px;background:#3b3329;color:#eac474;font-size:17px;font-weight:600;flex-shrink:0}.back,button{cursor:pointer}input,select{width:100%;background:#111;border:1px solid #8e733e;border-radius:10px;color:#fff;padding:13px;margin:10px 0;font:inherit}.person{display:block;width:100%;color:#f6e2b7;text-decoration:none;padding:15px;margin:9px 0;border:1px solid #756139;border-radius:12px;background:#18150f}.person small{display:block;margin-top:6px}.student-person{border:1px solid #929292;border-radius:22px;background:linear-gradient(155deg,#303030 0%,#151515 65%,#34271b 100%);box-shadow:inset 0 2px 2px #ffffff30,0 7px 18px #0009;padding:19px 20px;margin:12px 0;color:#eac77f;font-weight:600;font-size:16px}.student-person small{font-weight:400;color:#bcbcbc;font-size:13px;margin-top:9px}.filter-action{box-shadow:inset 0 2px 2px #f5d27a65,0 7px 18px #0009;border:2px solid #b58b42}.filter-action .symbol{font-size:0}.filter-action .symbol svg{width:28px;height:28px;stroke:#efc66d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wand-standard-dock{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(95vw,650px);z-index:1001;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:9px;border:1px solid #d3a54c;border-radius:23px;background:linear-gradient(145deg,#30210f,#080808 55%,#291c0d);box-shadow:inset 0 1px #ffe8a999,0 0 23px #dca53644,0 12px 24px #000e}
.wand-standard-dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:70px;padding:5px 1px;text-decoration:none;color:#eee;border:1px solid #898989;border-radius:19px;background:linear-gradient(155deg,#303030,#171717 75%,#292017);box-shadow:inset 0 2px 2px #ffffff77,0 3px 8px #000b;text-align:center}
.wand-standard-dock a svg{flex-shrink:0}.wand-standard-dock a small{font-size:12px;font-weight:600;color:#eee}
@media(max-width:390px){.wand-standard-dock{gap:3px;padding:7px 5px}.wand-standard-dock a{min-height:61px;border-radius:15px}.wand-standard-dock a svg{width:23px;height:23px}.wand-standard-dock a small{font-size:10px}}
.error{color:#ff9a9a}
</style></head><body><main><button class="back" id="back">← Voltar à Avaliação Fotográfica</button><h1 id="heading">Avaliação Fotográfica</h1><p id="subtitle" class="muted"></p><p id="status" role="status"></p><section id="area"></section></main><nav class="wand-standard-dock" aria-label="Navegação WandCoach"><a href="admin.html" aria-label="Início"><svg aria-hidden="true" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v11H3z"/></svg><small>Início</small></a><a href="admin.html#wc/alunos" aria-label="Alunos"><svg aria-hidden="true" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg><small>Alunos</small></a><a href="admin.html#wc/treinos" aria-label="Treinos"><svg aria-hidden="true" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="5.5" y="6.5" width="4" height="11" rx="1"/><path d="M9.5 12h5"/><rect x="14.5" y="6.5" width="4" height="11" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg><small>Treinos</small></a><a href="admin.html#wc/evolucao" aria-label="Evolução"><svg aria-hidden="true" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V15M8 20v-8M13 20v-5M18 20v-9"/><path d="m3 13 6-5 4 3 8-8M16 3h5v5"/></svg><small>Evolução</small></a><a href="admin.html#wc/fotografica" aria-label="Menu"><svg aria-hidden="true" viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v4H4zM14 5h6v4h-6zM4 15h6v4H4zM14 15h6v4h-6z"/></svg><small>Menu</small></a></nav><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const qs=new URLSearchParams(location.search),mode=qs.get('modo')||'postural',origin=qs.get('origem')||'#wc/fotografica';
const $=id=>document.getElementById(id),area=$('area');let students=[],photos=[],posturals=[],consents=[],available={postural:true,consent:true};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const make=(tag,text,parent=area,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;parent.append(e);return e};
const info=(s,bad=false)=>{$('status').textContent=s;$('status').className=bad?'error':'muted'};
const date=x=>x?new Date(x).toLocaleDateString('pt-BR'):'Sem data';
const active=s=>!['inativo','excluido','excluído'].includes(norm(s.Status));
const photoKey=p=>String(p.aluno_id)+'|'+String(p.criado_em||'').slice(0,10);
const groups=id=>new Set(photos.filter(p=>String(p.aluno_id)===String(id)).map(photoKey)).size;
const published=id=>posturals.filter(p=>String(p.aluno_id)===String(id)&&p.status==='publicado');
const pending=id=>{const fotos=photos.filter(p=>String(p.aluno_id)===String(id));if(!fotos.length)return false;const ultimaFoto=fotos.map(p=>String(p.criado_em||'').slice(0,10)).sort().at(-1);const ultimaPublicada=published(id).map(p=>String(p.avaliado_em||'').slice(0,10)).sort().at(-1);return !ultimaPublicada||ultimaFoto>ultimaPublicada};
const consented=id=>consents.some(c=>String(c.aluno_id)===String(id)&&c.status_avaliacao==='autorizada');
const href=(page,id,extra='')=>page+'?id='+encodeURIComponent(id)+extra+'&origem='+encodeURIComponent(location.href);
const link=(name,desc,url,parent=area)=>{const a=make('a',name,parent,'person');a.href=url;make('small',desc,a);return a};
const card=(title,sub,icon,count,fn)=>{const b=make('button',undefined,area,'action');b.type='button';make('span',icon,b,'symbol');const copy=make('span',undefined,b,'copy');make('strong',title,copy);make('small',sub,copy);make('span',count===null?'›':String(count),b,'count');b.onclick=fn;return b};
const goBack=()=>{location.href='admin.html'+(origin.startsWith('#wc/')?origin:'#wc/fotografica')};
function view(title,sub,fn){area.replaceChildren();$('heading').textContent=title;$('subtitle').textContent=sub;$('back').onclick=fn||goBack;info('')}
function categoria(a){const m=norm(a.modalidade).replace(/[\\s_-]+/g,' ');if(m.includes('semi')&&m.includes('presencial'))return 'semipresencial';if(m.includes('pacote')||m.includes('aula avulsa'))return 'pacote';if(m.includes('online')||m.includes('on line'))return 'online';if(m.includes('presencial'))return 'presencial';return 'outros'}
function list(title,sub,items,fn,empty){
 view(title,sub,()=>home());
 const search=make('input');search.placeholder='Buscar aluno pelo nome';search.setAttribute('aria-label','Buscar aluno');
 const filtro=make('button',undefined,area,'action filter-action');filtro.type='button';filtro.style.minHeight='70px';
 const options=make('div');options.className='card';options.hidden=true;
 const holder=make('div');
 const names={todos:'Todos',presencial:'Presencial',online:'Online',semipresencial:'Semipresencial',pacote:'Pacote de aulas',outros:'Outras modalidades'};
 let selected='todos',open=false;
 function draw(){
  filtro.replaceChildren();
  const ic=make('span',undefined,filtro,'symbol');ic.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="5"/><path d="M2 28v-3a10 10 0 0 1 20 0v3"/><path d="M24 7a5 5 0 0 1 0 10M25 20a8 8 0 0 1 5 8"/></svg>';
  const copy=make('span',undefined,filtro,'copy');
  make('strong',names[selected],copy);make('small','Filtrar por modalidade',copy);
  make('span',open?'⌃':'⌄',filtro,'count');
  filtro.setAttribute('aria-expanded',String(open));
  options.hidden=!open;options.replaceChildren();
  if(open)for(const [key,label] of Object.entries(names)){
   if(key==='outros'&&!items.some(a=>categoria(a)==='outros'))continue;
   const opt=make('button',(selected===key?'✓  ':'')+label,options,'person');opt.type='button';
   opt.onclick=()=>{selected=key;open=false;draw()};
  }
  holder.replaceChildren();
  const term=norm(search.value);
  const rows=items.filter(a=>(selected==='todos'||categoria(a)===selected)&&norm(a.nome_completo).includes(term)).sort((a,b)=>a.nome_completo.localeCompare(b.nome_completo,'pt-BR'));
  if(!rows.length){make('p',empty||'Nenhum aluno encontrado para esta busca ou modalidade.',holder,'muted');return}
  for(const a of rows){const entry=link(a.nome_completo,fn.description(a),fn.url(a),holder);entry.classList.add('student-person');}
 }
 filtro.onclick=()=>{open=!open;draw()};
 search.oninput=draw;draw();
}
function home(){if(mode==='postural'){view('Análise Postural','Avalie as fotografias, registre observações e libere pareceres ao aluno.');if(!available.postural)info('A tabela de análises posturais não está disponível. Configure o SQL correspondente no Supabase.',true);card('Avaliações Pendentes','Fotografias aguardando análise profissional','◷',pendingStudents().length,()=>list('Avaliações Pendentes','Alunos com fotos e sem parecer postural publicado.',pendingStudents(),{url:a=>href('avaliacao-postural.html',a.id),description:a=>groups(a.id)+' registro(s) fotográfico(s)'},'Nenhuma avaliação pendente.'));card('Avaliações Concluídas','Pareceres publicados e histórico','✓',new Set(posturals.filter(p=>p.status==='publicado').map(p=>String(p.aluno_id))).size,()=>list('Avaliações Concluídas','Selecione um aluno para consultar suas análises.',students.filter(a=>published(a.id).length),{url:a=>href('avaliacao-postural.html',a.id),description:a=>published(a.id).length+' parecer(es) publicado(s)'},'Nenhuma avaliação concluída.'));card('Nova Análise Postural','Selecionar aluno e iniciar avaliação','+',null,()=>list('Nova Análise Postural','Selecione um aluno para iniciar ou continuar.',students,{url:a=>href('avaliacao-postural.html',a.id),description:a=>a.modalidade||'Modalidade não informada'},'Nenhum aluno disponível.'));return}
if(mode==='comparar'){view('Comparar Fotografias','Acompanhe a evolução visual do aluno ao longo do tempo.');card('Nova Comparação','Escolher aluno, duas datas e posição','⇄',null,()=>list('Nova Comparação','Alunos com pelo menos duas datas de fotografias.',students.filter(a=>groups(a.id)>=2),{url:a=>href('avaliacao-fotografica-painel.html',a.id,'&modo=comparar'),description:a=>groups(a.id)+' datas disponíveis'},'Nenhum aluno possui duas datas de fotografias para comparar.'));card('Histórico de Comparações','Comparações salvas anteriormente','▤',null,()=>{view('Histórico de Comparações','Registro de comparações profissionais.');make('p','Ainda não há um histórico persistente de comparações configurado. As comparações visuais atuais não são salvas automaticamente.',area,'card')});card('Linha do Tempo Fotográfica','Registros organizados por data','▦',null,()=>list('Linha do Tempo Fotográfica','Escolha o aluno para visualizar as datas registradas.',students.filter(a=>groups(a.id)>0),{url:a=>href('avaliacao-fotografica-painel.html',a.id,'&modo=consultar'),description:a=>groups(a.id)+' data(s) fotográfica(s)'},'Nenhum registro fotográfico disponível.'));return}
if(mode==='autorizacoes'){view('Autorizações Fotográficas','Acompanhe consentimentos de uso interno e divulgação.');if(!available.consent){info('Não foi possível consultar os consentimentos fotográficos existentes.',true);card('Autorizações Pendentes','Dados indisponíveis','◷','—',()=>{view('Autorizações Pendentes','Dados indisponíveis.');make('p','Não é possível identificar pendências sem a tabela de consentimentos.',area,'card')});card('Autorizações Concedidas','Dados indisponíveis','✓','—',()=>{view('Autorizações Concedidas','Dados indisponíveis.');make('p','Não é possível confirmar autorizações sem registros válidos.',area,'card')});return}const waiting=students.filter(a=>!consented(a.id)),done=students.filter(a=>consented(a.id));card('Autorizações Pendentes','Alunos sem autorização interna válida','◷',waiting.length,()=>list('Autorizações Pendentes','Alunos que ainda não autorizaram o uso interno das imagens.',waiting,{url:a=>href('avaliacao-fotografica-painel.html',a.id,'&modo=autorizacoes'),description:a=>'Autorização interna pendente'},'Nenhuma autorização pendente.'));card('Autorizações Concedidas','Alunos com autorização interna válida','✓',done.length,()=>list('Autorizações Concedidas','Alunos com autorização de avaliação registrada.',done,{url:a=>href('avaliacao-fotografica-painel.html',a.id,'&modo=autorizacoes'),description:a=>{const c=consents.find(c=>String(c.aluno_id)===String(a.id)&&c.status_avaliacao==='autorizada');return 'Última atualização: '+date(c?.atualizado_em)}},'Nenhuma autorização concedida.'));return}}
function pendingStudents(){return students.filter(a=>pending(a.id))}
async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data:p,error:e}=await db.from('profiles').select('role').eq('id',user.id).single();if(e||p?.role!=='admin')throw Error('Acesso exclusivo do treinador.');const result=await Promise.all([db.from('alunos').select('id,nome_completo,modalidade,Status').order('nome_completo'),db.from('fotos_avaliacao').select('aluno_id,criado_em,posicao'),db.from('wand_avaliacoes_posturais').select('aluno_id,status,avaliado_em'),db.from('consentimentos_fotograficos').select('aluno_id,status_avaliacao,divulgacao_autorizada,atualizado_em')]);if(result[0].error)throw result[0].error;students=(result[0].data||[]).filter(active);if(result[1].error)throw result[1].error;photos=result[1].data||[];available.postural=!result[2].error;posturals=result[2].data||[];available.consent=!result[3].error;consents=result[3].data||[];home()}catch(e){info('Erro ao carregar dados: '+e.message,true)}}
init();
</script></body></html>
