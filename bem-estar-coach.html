 const box=make('div',undefined,content,'panel');if(mode!=='feminina')make('h2',(labels[mode]||labels.aluno)[0],box);

 const card=(titulo,desc,fn)=>{const b=make('button',undefined,menu,'student cycle-menu');const ico=make('span',undefined,b,'cycle-icon');ico.innerHTML=titulo.includes('sintomas')?'<svg viewBox="0 0 24 24"><path d="M3 12h4l3-6 4 12 3-6h4"/><path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1"/></svg>':'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M7 14h3m4 0h3"/></svg>';const copy=make('span',undefined,b);make('strong',titulo,copy);make('small',desc,copy);make('span','›',b,'cycle-arrow');b.onclick=()=>abrir(titulo,fn);if(restore&&qs.get('secao')===titulo)abrir(titulo,fn,true)};
 if(!ciclos.length&&!sintomas.some(r=>r.menstruando===true)){make('p','A aluna ainda não registrou seu ciclo menstrual.',menu);solicitar()}

 if(last){make('p','Último período: '+fmt(last.inicio)+' a '+fmt(last.termino),p);if(last.termino)make('p','Duração: '+(1+(Date.parse(last.termino)-Date.parse(last.inicio))/86400000)+' dias',p)}

 card('Histórico de sintomas','Registros por data e intensidade',p=>{if(!sintomas.length)make('p','A aluna ainda não registrou sintomas.',p);for(const r of sintomas){const item=make('details',undefined,p,'checkin');make('summary',fmt(r.dia),item);const body=make('div',undefined,item,'checkin-body');renderSintoma(r,body)}});
 return;
 }
 const {data,error}=await db.rpc('wand_coach_bemestar_aluno',{p_aluno_id:Number(a.id)});
  if(error)throw error;
  const bem=data||{};status.remove();
  if(mode==='checkins'){const p=make('div',undefined,content,'panel');make('h2','Treinos adaptados',p);const {data:ad,error:ae}=await db.rpc('wand_coach_adaptacoes_aluno',{p_aluno_id:Number(a.id)});if(ae)make('p','Não foi possível consultar os treinos adaptados.',p);else if(!ad?.length)make('p','Nenhum treino adaptado programado.',p);else for(const x of ad){const d=make('details',undefined,p,'checkin');make('summary',x.dia.split('-').reverse().join('/')+' · '+(x.alternativo||'Treino adaptado'),d);const b=make('div',undefined,d,'checkin-body');make('p','Treino original: '+(x.original||'—'),b);make('p','Status: '+x.status,b);if(x.justificativa)make('p',x.justificativa,b);}}
 if(!bem.ativo){make('p','O aluno não ativou o acompanhamento de bem-estar.',box);return}
  if(mode==='feminina'&&!bem.ciclo_compartilhado){make('p','A aluna não autorizou o compartilhamento de informações menstruais com o treinador. O calendário permanece privado.',box);return}
  if(mode==='feminina')make('p','Exibindo somente informações compartilhadas voluntariamente. O calendário menstrual privado não é exibido.',box);
  const registros=Array.isArray(bem.registros)?bem.registros:[];
  if(!registros.length){make('p','Ainda não existem registros disponíveis.',box);return}
  const dataFormatada=dia=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dia||'')))return String(dia||'Data não informada');const [ano,mes,d]=dia.split('-').map(Number);const dt=new Date(ano,mes-1,d);if(dt.getFullYear()!==ano||dt.getMonth()!==mes-1||dt.getDate()!==d)return String(dia);return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(dt)};
  for(const registro of registros){
   const item=make('details',undefined,box,'checkin');

   if(mode!=='feminina'){
    make('p','Energia: '+(registro.energia??'—')+'/5 · Sono: '+(registro.sono??'—')+'/5 · Disposição: '+(registro.disposicao??'—')+'/5 · Dor muscular: '+(registro.dor_muscular??'—')+'/5',body);

   }
   if(mode!=='checkins'&&bem.ciclo_compartilhado&&registro.menstruando!==null&&registro.menstruando!==undefined){
    make('p','Menstruação: '+(registro.menstruando?'Sim':'Não')+(registro.colica!==null&&registro.colica!==undefined?' · Cólicas: '+registro.colica+'/5':''),body);
   }else if(mode==='feminina'){make('p','Sem informações menstruais compartilhadas nesta data.',body)}
  }
 }catch(e){if(!status.isConnected)box.append(status);status.textContent='Não foi possível consultar os registros. Tente novamente.'}

async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data:p,error:e}=await db.from('profiles').select('role').eq('id',user.id).single();if(e||p?.role!=='admin')throw Error('Acesso restrito ao treinador.');const {data,error}=await db.from('alunos').select('id,nome_completo,modalidade,Status,sexo').order('nome_completo');if(error)throw error;students=(data||[]).filter(a=>!['inativo','excluido','excluído'].includes(norm(a.Status)));const restored=students.find(a=>String(a.id)===qs.get('aluno')&&(mode!=='feminina'||isFemale(a)));if(restored)await detail(restored,true);else listing()}catch(e){$('status').textContent='Não foi possível carregar os alunos: '+e.message}}
init();
