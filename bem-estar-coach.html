6.5" width="4" height="11" rx="1"/><path d="M9.5 12h5"/><rect x="14.5" y="6.5" width="4" height="11" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/></svg><small>Treinos</small></button><button type="button" data-wc-dock="evolucoes" aria-label="Evolução"><svg aria-hidden="true" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V15M8 20v-8M13 20v-5M18 20v-9"/><path d="m3 13 6-5 4 3 8-8M16 3h5v5"/></svg><small>Evolução</small></button><button type="button" data-wc-dock="menu" aria-label="Abrir menu" aria-expanded="false">☷<small>Menu</small></button></nav><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const qs=new URLSearchParams(location.search),mode=qs.get('modo')||'aluno',origin=qs.get('origem')||'#wc/bemestar';
const $=id=>document.getElementById(id),content=$('content');let students=[];
const labels={aluno:['Selecionar Aluno','Consulte as informações de bem-estar de um aluno.'],checkins:['Check-ins','Consulte os registros de bem-estar dos alunos.'],feminina:['Saúde Feminina','Informações de bem-estar compartilhadas mediante autorização da aluna.'],historico:['Histórico de Acompanhamentos','Acompanhe ocorrências e registros anteriores.']};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const isFemale=a=>['feminino','f','mulher'].includes(norm(a.sexo));
const category=a=>{const m=norm(a.modalidade);if(m.includes('semi'))return 'semipresencial';if(m.includes('pacote')||m.includes('avulsa'))return 'pacote';if(m.includes('online')||m.includes('on line'))return 'online';if(m.includes('presencial'))return 'presencial';return 'outros'};
const make=(tag,txt,parent=content,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e};
document.querySelectorAll('[data-wc-dock]').forEach(b=>b.onclick=()=>{const k=b.dataset.wcDock;location.href='admin.html'+(k==='home'||k==='menu'?'': '#wc/'+(k==='evolucoes'?'evolucao':k))});
const back=()=>location.href='admin.html'+(origin.startsWith('#wc/')?origin:'#wc/bemestar');
function listing(){content.replaceChildren();$('title').textContent=(labels[mode]||labels.aluno)[0];$('description').textContent=(labels[mode]||labels.aluno)[1];$('back').textContent='← Voltar ao Bem-estar';$('back').onclick=back;const search=make('input');search.placeholder='Buscar aluno pelo nome';search.setAttribute('aria-label','Buscar aluno');const select=make('button',undefined,content,'filter');select.type='button';const choices=make('div',undefined,content,'choices');const rows=make('div');const names={todos:'Todos',presencial:'Presencial',online:'Online',semipresencial:'Semipresencial',pacote:'Pacote de aulas',outros:'Outras modalidades'};let chosen='todos',expanded=false;
function draw(){select.replaceChildren();const symbol=make('span',undefined,select,'symbol');symbol.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="5"/><path d="M2 28v-3a10 10 0 0 1 20 0v3"/><path d="M24 7a5 5 0 0 1 0 10M25 20a8 8 0 0 1 5 8"/></svg>';const copy=make('span',undefined,select);make('strong',names[chosen],copy);make('small','Filtrar alunos por modalidade',copy);make('span',expanded?'⌃':'⌄',select,'arrow');select.setAttribute('aria-expanded',String(expanded));choices.hidden=!expanded;choices.style.display=expanded?'block':'none';choices.replaceChildren();if(expanded)for(const [key,name] of Object.entries(names)){if(key==='outros'&&!students.some(a=>(mode!=='feminina'||isFemale(a))&&category(a)==='outros'))continue;const b=make('button',(chosen===key?'✓ ':'')+name,choices);b.setAttribute('aria-pressed',String(chosen===key));b.onclick=()=>{chosen=key;expanded=false;draw()}}
rows.replaceChildren();const term=norm(search.value);const matches=students.filter(a=>(mode!=='feminina'||isFemale(a))&&(chosen==='todos'||category(a)===chosen)&&norm(a.nome_completo).includes(term));if(!matches.length){make('p',mode==='feminina'?'Nenhuma aluna encontrada para esta seleção.':'Nenhum aluno encontrado para esta seleção.',rows);return}for(const a of matches){const b=make('button',a.nome_completo||'Aluno',rows,'student');make('small',[a.modalidade||'Modalidade não informada','Status: '+(a.Status||'Não informado'),'Selecionar aluno'].join(' · '),b);b.onclick=()=>detail(a)}}select.onclick=()=>{expanded=!expanded;draw()};search.oninput=draw;draw()}
async function detail(a){
 if(mode==='feminina'&&!isFemale(a)){listing();return}
 content.replaceChildren();$('title').textContent=a.nome_completo||'Aluno';$('description').textContent=(labels[mode]||labels.aluno)[0];$('back').textContent='← Voltar à lista de alunos';$('back').onclick=listing;
 const box=make('div',undefined,content,'panel');make('h2',(labels[mode]||labels.aluno)[0],box);
 const status=make('p','Consultando registros autorizados…',box);
 try{
  const {data,error}=await db.rpc('wand_coach_bemestar_aluno',{p_aluno_id:Number(a.id)});
  if(error)throw error;
  const bem=data||{};status.remove();
  if(!bem.ativo){make('p','O aluno não ativou o acompanhamento de bem-estar.',box);return}
  if(mode==='feminina'&&!bem.ciclo_compartilhado){make('p','A aluna não autorizou o compartilhamento de informações menstruais com o treinador. O calendário permanece privado.',box);return}
  if(mode==='feminina')make('p','Exibindo somente informações compartilhadas voluntariamente. O calendário menstrual privado não é exibido.',box);
  const registros=Array.isArray(bem.registros)?bem.registros:[];
  if(!registros.length){make('p','Ainda não existem registros disponíveis.',box);return}
  const dataFormatada=dia=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dia||'')))return String(dia||'Data não informada');const [ano,mes,d]=dia.split('-').map(Number);const dt=new Date(ano,mes-1,d);if(dt.getFullYear()!==ano||dt.getMonth()!==mes-1||dt.getDate()!==d)return String(dia);return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(dt)};
  for(const registro of registros){
   const item=make('details',undefined,box,'checkin');
   make('summary',dataFormatada(registro.dia),item);
   const body=make('div',undefined,item,'checkin-body');
   if(mode!=='feminina'){
    make('p','Energia: '+(registro.energia??'—')+'/5 · Sono: '+(registro.sono??'—')+'/5 · Disposição: '+(registro.disposicao??'—')+'/5 · Dor muscular: '+(registro.dor_muscular??'—')+'/5',body);
    if(registro.observacoes)make('p',registro.observacoes,body);
    if(registro.pedir_ajuste)make('p','Solicitação de conversa sobre adaptação registrada. A aprovação deve ser feita no fluxo próprio.',body);
   }
   if(bem.ciclo_compartilhado&&registro.menstruando!==null&&registro.menstruando!==undefined){
    make('p','Menstruação: '+(registro.menstruando?'Sim':'Não')+(registro.colica!==null&&registro.colica!==undefined?' · Cólicas: '+registro.colica+'/5':''),body);
   }else if(mode==='feminina'){make('p','Sem informações menstruais compartilhadas nesta data.',body)}
  }
 }catch(e){if(!status.isConnected)box.append(status);status.textContent='Não foi possível consultar os registros. Tente novamente.'}
}
async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data:p,error:e}=await db.from('profiles').select('role').eq('id',user.id).single();if(e||p?.role!=='admin')throw Error('Acesso restrito ao treinador.');const {data,error}=await db.from('alunos').select('id,nome_completo,modalidade,Status,sexo').order('nome_completo');if(error)throw error;students=(data||[]).filter(a=>!['inativo','excluido','excluído'].includes(norm(a.Status)));listing()}catch(e){$('status').textContent='Não foi possível carregar os alunos: '+e.message}}
init();
</script></body></html>
