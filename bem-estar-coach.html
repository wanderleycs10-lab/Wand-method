<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bem-estar · WandCoach</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 10%,#38250d,#090909 40%);color:#f5f5f5;font:15px system-ui,Arial}main{max-width:820px;margin:auto;padding:22px 17px 125px}h1{color:#eac474;font-size:25px}p{line-height:1.5;color:#bcbcbc}.back{background:transparent;color:#e6bd67;border:1px solid #a78541;border-radius:16px;padding:13px 17px;font:inherit;cursor:pointer}.filter{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#30220f,#151515 65%,#2d1e0b);border:2px solid #a9833d;border-radius:23px;color:white;padding:17px;margin:16px 0;cursor:pointer;box-shadow:inset 0 2px #f2d18550}.filter .symbol{width:50px;height:50px;display:grid;place-items:center;border:1px solid #9c7939;border-radius:13px;background:#352710}.symbol svg{width:30px;stroke:#efc66d;fill:none;stroke-width:2;stroke-linecap:round}.filter strong{display:block;font-size:17px}.filter small{display:block;color:#bbb;margin-top:5px}.filter .arrow{margin-left:auto;color:#efc66d;font-size:22px}.choices{border:1px solid #99773d;border-radius:18px;padding:10px;margin-bottom:15px}.choices button{display:block;width:100%;text-align:left;background:#171717;border:1px solid #665331;color:#e9d6ad;border-radius:12px;padding:13px;margin:6px 0;font:inherit;cursor:pointer}input{width:100%;background:linear-gradient(135deg,#242424,#101010);border:1px solid #888;border-radius:20px;padding:18px;color:#fff;font:inherit;margin:15px 0}.student{display:block;text-decoration:none;text-align:left;width:100%;border:1px solid #999;border-radius:24px;background:linear-gradient(155deg,#303030,#151515 65%,#34271b);box-shadow:inset 0 2px #ffffff38,0 8px 16px #0008;padding:20px;color:#edc87e;font:600 16px system-ui;cursor:pointer;margin:12px 0}.student small{display:block;font-weight:400;color:#bbb;margin-top:9px}.panel{border:1px solid #9a793b;background:linear-gradient(130deg,#2c210f,#161616 65%);border-radius:19px;padding:20px;margin:16px 0}.panel h2{font-size:19px;color:#e9c16d;margin-top:0}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(96%,600px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;border:1px solid #ad873c;border-radius:22px;background:linear-gradient(135deg,#21190c,#0e0e0e 55%,#24190b)}.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:65px;text-decoration:none;color:#eee;border:1px solid #777;border-radius:14px;background:linear-gradient(145deg,#292929,#101010);font-size:11px}.dock span{font-size:25px}</style></head><body><main><button class="back" id="back">← Voltar ao Bem-estar</button><h1 id="title">Bem-estar</h1><p id="description"></p><p id="status" role="status"></p><section id="content"></section></main><nav class="dock" aria-label="WandCoach"><a href="admin.html"><span>⌂</span>Início</a><a href="admin.html#wc/alunos"><span>♙</span>Alunos</a><a href="admin.html#wc/treinos"><span>▤</span>Treinos</a><a href="admin.html#wc/evolucao"><span>▥</span>Evolução</a><a href="admin.html#wc/bemestar"><span>☷</span>Menu</a></nav><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const qs=new URLSearchParams(location.search),mode=qs.get('modo')||'aluno',origin=qs.get('origem')||'#wc/bemestar';
const $=id=>document.getElementById(id),content=$('content');let students=[];
const labels={aluno:['Selecionar Aluno','Consulte as informações de bem-estar de um aluno.'],checkins:['Check-ins','Consulte os registros de bem-estar dos alunos.'],feminina:['Saúde Feminina','Informações de bem-estar compartilhadas mediante autorização da aluna.'],historico:['Histórico de Acompanhamentos','Acompanhe ocorrências e registros anteriores.']};
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const isFemale=a=>['feminino','f','mulher'].includes(norm(a.sexo));
const category=a=>{const m=norm(a.modalidade);if(m.includes('semi'))return 'semipresencial';if(m.includes('pacote')||m.includes('avulsa'))return 'pacote';if(m.includes('online')||m.includes('on line'))return 'online';if(m.includes('presencial'))return 'presencial';return 'outros'};
const make=(tag,txt,parent=content,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;parent.append(e);return e};
const back=()=>location.href='admin.html'+(origin.startsWith('#wc/')?origin:'#wc/bemestar');
function listing(){content.replaceChildren();$('title').textContent=(labels[mode]||labels.aluno)[0];$('description').textContent=(labels[mode]||labels.aluno)[1];$('back').onclick=back;const search=make('input');search.placeholder='Buscar aluno pelo nome';search.setAttribute('aria-label','Buscar aluno');const select=make('button',undefined,content,'filter');select.type='button';const choices=make('div',undefined,content,'choices');const rows=make('div');const names={todos:'Todos',presencial:'Presencial',online:'Online',semipresencial:'Semipresencial',pacote:'Pacote de aulas',outros:'Outras modalidades'};let chosen='todos',expanded=false;
function draw(){select.replaceChildren();const symbol=make('span',undefined,select,'symbol');symbol.innerHTML='<svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="10" r="5"/><path d="M2 28v-3a10 10 0 0 1 20 0v3"/><path d="M24 7a5 5 0 0 1 0 10M25 20a8 8 0 0 1 5 8"/></svg>';const copy=make('span',undefined,select);make('strong',names[chosen],copy);make('small','Filtrar alunos por modalidade',copy);make('span',expanded?'⌃':'⌄',select,'arrow');select.setAttribute('aria-expanded',String(expanded));choices.hidden=!expanded;choices.style.display=expanded?'block':'none';choices.replaceChildren();if(expanded)for(const [key,name] of Object.entries(names)){if(key==='outros'&&!students.some(a=>(mode!=='feminina'||isFemale(a))&&category(a)==='outros'))continue;const b=make('button',(chosen===key?'✓ ':'')+name,choices);b.onclick=()=>{chosen=key;expanded=false;draw()}}
rows.replaceChildren();const term=norm(search.value);const matches=students.filter(a=>(mode!=='feminina'||isFemale(a))&&(chosen==='todos'||category(a)===chosen)&&norm(a.nome_completo).includes(term));if(!matches.length){make('p',mode==='feminina'?'Nenhuma aluna encontrada para esta seleção.':'Nenhum aluno encontrado para esta seleção.',rows);return}for(const a of matches){const b=make('button',a.nome_completo||'Aluno',rows,'student');make('small',[a.modalidade||'Modalidade não informada','Status: '+(a.Status||'Não informado'),'Selecionar aluno'].join(' · '),b);b.onclick=()=>detail(a)}}select.onclick=()=>{expanded=!expanded;draw()};search.oninput=draw;draw()}
async function detail(a){
 if(mode==='feminina'&&!isFemale(a)){listing();return}
 content.replaceChildren();$('title').textContent=a.nome_completo||'Aluno';$('description').textContent=(labels[mode]||labels.aluno)[0];$('back').onclick=listing;
 const box=make('div',undefined,content,'panel');make('h2',(labels[mode]||labels.aluno)[0],box);
 const status=make('p','Consultando registros autorizados…',box);
 try{
  const {data,error}=await db.rpc('wand_coach_bemestar_aluno',{p_aluno_id:Number(a.id)});
  if(error)throw error;
  const bem=data||{};status.remove();
  if(!bem.ativo){make('p','O aluno não ativou o acompanhamento de bem-estar.',box);return}
  if(mode==='feminina'&&!bem.ciclo_compartilhado){make('p','A aluna não autorizou o compartilhamento de informações menstruais com o treinador. O calendário permanece privado.',box);return}
  if(mode==='feminina')make('p','Exibindo somente informações compartilhadas voluntariamente. O calendário menstrual privado não é exibido.',box);
  const registros=Array.isArray(bem.registros)?bem.registros:[];
  if(!registros.length){make('p','Ainda não existem registros disponíveis.',box);return}
  for(const registro of registros.slice(0,60)){
   const item=make('div',undefined,box,'panel');
   make('h2',registro.dia||'Registro',item);
   if(mode!=='feminina'){
    make('p','Energia: '+(registro.energia??'—')+'/5 · Sono: '+(registro.sono??'—')+'/5 · Disposição: '+(registro.disposicao??'—')+'/5 · Dor muscular: '+(registro.dor_muscular??'—')+'/5',item);
    if(registro.observacoes)make('p',registro.observacoes,item);
    if(registro.pedir_ajuste)make('p','Solicitação de conversa sobre adaptação registrada. A aprovação deve ser feita no fluxo próprio.',item);
   }
   if(bem.ciclo_compartilhado&&registro.menstruando!==null&&registro.menstruando!==undefined){
    make('p','Menstruação: '+(registro.menstruando?'Sim':'Não')+(registro.colica!==null&&registro.colica!==undefined?' · Cólicas: '+registro.colica+'/5':''),item);
   }else if(mode==='feminina'){make('p','Sem informações menstruais compartilhadas nesta data.',item)}
  }
 }catch(e){status.textContent='Não foi possível consultar os registros: '+e.message}
}
async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const {data:p,error:e}=await db.from('profiles').select('role').eq('id',user.id).single();if(e||p?.role!=='admin')throw Error('Acesso restrito ao treinador.');const {data,error}=await db.from('alunos').select('id,nome_completo,modalidade,Status,sexo').order('nome_completo');if(error)throw error;students=(data||[]).filter(a=>!['inativo','excluido','excluído'].includes(norm(a.Status)));listing()}catch(e){$('status').textContent='Não foi possível carregar os alunos: '+e.message}}
init();
</script></body></html>
