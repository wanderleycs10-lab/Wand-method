<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar senha | WAND METHOD</title><style>*{box-sizing:border-box}body{background:#080808;color:#eee3cf;font:16px Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);background:linear-gradient(140deg,#262016,#111);border:1px solid #a7813d;border-radius:22px;padding:30px;box-shadow:0 20px 50px #0008}img{width:95px;display:block;margin:0 auto 15px}h1{text-align:center;color:#e6bd68;font-size:26px}p{line-height:1.6}label{display:block;margin:20px 0 6px}input{width:100%;padding:14px;border:1px solid #a7813d;border-radius:10px;background:#090909;color:#fff;font-size:17px}button{background:#d8ae58;color:#17110b;font-weight:bold;border:0;border-radius:10px;padding:15px 18px;margin-top:20px;width:100%;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#mensagem{color:#f3d58f}a{color:#e5c27c}</style><style>.card > img{width:min(100%,380px)!important;height:auto!important;object-fit:contain;filter:none;max-height:190px;}</style></head><body><main class="card"><img src="./wand-logo-completa-oficial.png" alt="Logo WAND METHOD"><h1>Recupere sua senha</h1><p>Informe o e-mail cadastrado para receber um link seguro de recuperação.</p><form id="form"><label for="email">Seu e-mail</label><input id="email" type="email" autocomplete="email" required maxlength="254"><button id="enviar">ENVIAR LINK DE RECUPERAÇÃO</button><p id="mensagem" role="status"></p></form><p><a href="./login.html">← Voltar ao login</a></p></main><dialog id="aviso" style="background:#211c15;color:#f3d58f;border:1px solid #a7813d;border-radius:18px;padding:28px;max-width:min(90vw,440px)"><h2 id="titulo"></h2><p id="texto"></p><button id="ok">Entendi</button></dialog><style>dialog::backdrop{background:#000b}</style><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://kvxdnreipuahoaostlle.supabase.co","sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo",{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const $=id=>document.getElementById(id);$("ok").onclick=()=>$("aviso").close();$("form").onsubmit=async e=>{e.preventDefault();const b=$("enviar");if(b.disabled)return;b.disabled=true;b.textContent="Enviando…";try{const {error}=await db.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo:"https://wandmethod.com.br/nova-senha.html"});if(error&&error.status!==400&&error.status!==404)throw error;$("titulo").textContent="Solicitação recebida";$("texto").textContent="Se o e-mail estiver cadastrado, você receberá um link para redefinir sua senha. Confira também a caixa de spam.";}catch{$("titulo").textContent="Não foi possível concluir";$("texto").textContent="Aguarde alguns instantes e tente novamente.";}finally{b.disabled=false;b.textContent="ENVIAR LINK DE RECUPERAÇÃO";$("aviso").showModal();}};</script></body></html>
