html{color-scheme:dark}body{display:block;margin:0;padding:0;background:radial-gradient(ellipse at 90% 13%,#58350c52,transparent 35%),#070707;color:#fff;font-family:Arial,sans-serif}body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(145deg,transparent 8%,#d59d24 8.2%,transparent 8.6% 12%,#a66e17 12.2%,transparent 12.5% 88%,#c58b1b 88.3%,transparent 88.7%)}.shell{width:min(100%,460px);margin:auto;min-height:100dvh;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}.shell>.logo{width:min(100%,380px);height:auto;max-height:200px;object-fit:contain;margin:0 auto 8px}.intro{margin:4px 0 14px}.intro h1{font-size:clamp(23px,4dvh,31px);color:white;margin:8px 0}.intro p{font-size:14px;color:#c9c9c9;margin:4px 0}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffd06c;font-weight:bold}.shell .card{width:100%;text-align:left;padding:22px;border:1px solid #c49a49;background:linear-gradient(145deg,#30200d,#191613 42%,#0e0e0e);box-shadow:inset 0 2px #ffe6a366,inset 0 -3px 8px #d9a33222,0 14px 30px #000a,0 0 22px #d2a02925}.card label{font-size:12px;color:#ebd9b2;font-weight:600;margin:12px 0 7px}.card input{min-height:50px;font-size:16px;padding:13px 54px 13px 15px;border-color:#9a7842}.pass{position:relative}.pass .eye{position:absolute;right:5px;top:3px;width:44px;height:44px;margin:0;padding:8px;background:transparent;border:0;color:#e8b83b;box-shadow:none}.eye svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}.card #salvar,dialog button{background:linear-gradient(125deg,#ad7411,#e4ad30 20%,#ffe596 48%,#e8b43f 76%,#a86c0e);border:1px solid #ffda77;color:#160e04;box-shadow:inset 0 2px 1px #fff6d1aa,inset 0 -3px 5px #84520a66,0 7px 17px #0009,0 0 18px #d4a02b42;font-size:14px;min-height:48px;border-radius:11px}#mensagem{font-size:13px;line-height:1.5}dialog#aviso{width:min(90vw,420px);text-align:center;background:linear-gradient(145deg,#30200d,#191613 42%,#0e0e0 </style></head><body><main class="shell"><img class="logo" src="./wand-logo-completa-oficial.png" alt="Logo WAND METHOD"><div class="intro"><span class="eyebrow">SEGURANÇA DA CONTA</span><h1>Crie sua senha</h1><p>Defina uma senha pessoal para acessar sua conta WAND METHOD. O acesso aos treinos será liberado após a ativação pelo treinador.</p></div><section class="card"><p id="mensagem" role="status">Validando seu convite seguro…</p><form id="form" hidden><label for="senha">Nova senha (mínimo de 8 caracteres)</label><input id="senha" type="password" minlength="8" autocomplete="new-password" required><label for="confirmar">Confirme a senha</label><input id="confirmar" type="password" minlength="8" autocomplete="new-password" required><button id="salvar">SALVAR MINHA SENHA</button></form><p id="final" hidden><a href="./login.html">Ir para o login</a></p></section></main><dialog id="aviso"><svg class="success-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21"/><path d="m13 24 7 7 15-15" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Senha salva com sucesso!</h2><p>Agora você pode acessar sua conta WAND METHOD.</p><button type="button" onclick="location.replace('./login.html')">ACESSAR MINHA CONTA</button></dialog><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://kvxdnreipuahoaostlle.supabase.co","sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo");const $=id=>document.getElementById(id);let pronto=false;async function iniciar(){try{const q=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const token_hash=q.get("token_hash")||hash.get("token_hash");const type=q.get("type")||hash.get("type");if(token_hash&&["invite","recovery"].includes(type)){const{error}=await db.auth.verifyOtp({token_hash,type});if(error)throw error}const{data:{user}}=await db.auth.getUser();if(!user)throw Error("Convite inválido ou expirado. Solicite um novo convite ao treinador.");pronto=true;$("mensagem").textContent="Identidade confirmada. Escolha sua senha.";$("form").hidden=false;history.replaceState(null,"",location.pathname)}catch(e){$("mensagem").textContent=e.message||"Não foi possível validar o convite."}}iniciar();$("form").onsubmit=async e=>{e.preventDefault();if(!pronto)return;const a=$("senha").value,b=$("confirmar").value;if(a.length<8||a!==b){$("mensagem").textContent="As senhas precisam ser iguais e ter pelo menos 8 caracteres.";return}const btn=$("salvar");btn.disabled=true;try{const{error}=await db.auth.updateUser({password:a});if(error)throw error;$("mensagem").textContent="Senha criada com sucesso! Você já pode entrar com seu e-mail.";$("form").hidden=true;$("final").hidden=false;await db.auth.signOut()}catch(e){$("mensagem").textContent=e.message||"Não foi possível salvar sua senha."}finally{btn.disabled=false}};</script><script>document.addEventListener("DOMContentLoaded",()=>{for(const id of ["senha","confirmar"]){const input=document.getElementById(id);const wrap=document.createElement("div");wrap.className="pass";input.before(wrap);wrap.append(input);const b=document.createElement("button");b.type="button";b.className="eye";b.setAttribute("aria-label","Mostrar senha");b.setAttribute("aria-pressed","false");b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M3 3l18 18" style="display:none"/></svg>';b.onclick=()=>{const show=input.type==="password";input.type=show?"text":"password";b.setAttribute("aria-pressed",String(show));b.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");b.querySelector(".slash").style.display=show?"":"none"};wrap.append(b)}});</script><script>document.addEventListener("DOMContentLoaded",()=>{const m=document.getElementById("mensagem");new MutationObserver(()=>{if(m.textContent.startsWith("Senha criada com sucesso!")){const d=document.getElementById("aviso");if(!d.open)d.showModal()}}).observe(m,{childList:true,characterData:true,subtree:true})});</script></body></html>
