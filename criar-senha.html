<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Criar senha | WAND METHOD</title><style>*{box-sizing:border-box}body{background:#080808;color:#eee3cf;font:16px Arial,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);background:linear-gradient(140deg,#262016,#111);border:1px solid #a7813d;border-radius:22px;padding:30px;box-shadow:0 20px 50px #0008}img{width:95px;display:block;margin:0 auto 15px}h1{text-align:center;color:#e6bd68;font-size:26px}p{line-height:1.6}label{display:block;margin:20px 0 6px}input{width:100%;padding:14px;border:1px solid #a7813d;border-radius:10px;background:#090909;color:#fff;font-size:17px}button{background:#d8ae58;color:#17110b;font-weight:bold;border:0;border-radius:10px;padding:15px 18px;margin-top:20px;width:100%;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#mensagem{color:#f3d58f}a{color:#e5c27c}</style><style>.card > img{width:min(100%,380px)!important;height:auto!important;object-fit:contain;filter:none;max-height:190px;}</style></head><body><main class="card"><img src="./wand-logo-completa-oficial.png" alt="Logo WAND METHOD"><h1>Crie sua senha</h1><p>Defina uma senha pessoal para acessar sua conta WAND METHOD. O acesso aos treinos será liberado após a ativação pelo treinador.</p><p id="mensagem" role="status">Validando seu convite seguro…</p><form id="form" hidden><label for="senha">Nova senha (mínimo de 8 caracteres)</label><input id="senha" type="password" minlength="8" autocomplete="new-password" required><label for="confirmar">Confirme a senha</label><input id="confirmar" type="password" minlength="8" autocomplete="new-password" required><button id="salvar">SALVAR MINHA SENHA</button></form><p id="final" hidden><a href="./login.html">Ir para o login</a></p></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const db=createClient("https://kvxdnreipuahoaostlle.supabase.co","sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo");const $=id=>document.getElementById(id);let pronto=false;async function iniciar(){try{const q=new URLSearchParams(location.search);const hash=new URLSearchParams(location.hash.slice(1));const token_hash=q.get("token_hash")||hash.get("token_hash");const type=q.get("type")||hash.get("type");if(token_hash&&["invite","recovery"].includes(type)){const{error}=await db.auth.verifyOtp({token_hash,type});if(error)throw error}const{data:{user}}=await db.auth.getUser();if(!user)throw Error("Convite inválido ou expirado. Solicite um novo convite ao treinador.");pronto=true;$("mensagem").textContent="Identidade confirmada. Escolha sua senha.";$("form").hidden=false;history.replaceState(null,"",location.pathname)}catch(e){$("mensagem").textContent=e.message||"Não foi possível validar o convite."}}iniciar();$("form").onsubmit=async e=>{e.preventDefault();if(!pronto)return;const a=$("senha").value,b=$("confirmar").value;if(a.length<8||a!==b){$("mensagem").textContent="As senhas precisam ser iguais e ter pelo menos 8 caracteres.";return}const btn=$("salvar");btn.disabled=true;try{const{error}=await db.auth.updateUser({password:a});if(error)throw error;$("mensagem").textContent="Senha criada com sucesso! Você já pode entrar com seu e-mail.";$("form").hidden=true;$("final").hidden=false;await db.auth.signOut()}catch(e){$("mensagem").textContent=e.message||"Não foi possível salvar sua senha."}finally{btn.disabled=false}};</script></body></html>
