async function load(){const {data,error}=await db.from('fotos_avaliacao').select('*').eq('aluno_id',id).order('criado_em',{ascending:false});if(error)throw error;photos=data||[]}

let viewer=null;
function openPhotoViewer(img){
 if(!viewer){
  viewer=document.createElement('div');viewer.className='photo-viewer';viewer.hidden=true;viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label','Visualizar fotografia ampliada');
  viewer.innerHTML='<div class="photo-viewer-toolbar"><button type="button" data-zoomout aria-label="Diminuir zoom">−</button><button type="button" data-zoomin aria-label="Aumentar zoom">+</button><button type="button" data-reset>100%</button><button type="button" data-close>Fechar ×</button></div><div class="photo-viewer-stage"><img alt=""></div><div class="photo-viewer-hint">Use dois dedos ou a roda do mouse para ampliar. Arraste para explorar.</div>';
  document.body.append(viewer);

  const draw=()=>{large.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')'};
  const zoom=(factor,cx=0,cy=0)=>{const next=Math.max(1,Math.min(6,scale*factor));if(next===scale)return;const ratio=next/scale;x=cx+(x-cx)*ratio;y=cy+(y-cy)*ratio;scale=next;if(scale===1)x=y=0;draw()};
  viewer.querySelector('[data-zoomin]').onclick=()=>zoom(1.35);
  viewer.querySelector('[data-zoomout]').onclick=()=>zoom(1/1.35);
  viewer.querySelector('[data-reset]').onclick=()=>{scale=1;x=y=0;draw()};
  const close=()=>{viewer.hidden=true;large.removeAttribute('src');pointers.clear();document.removeEventListener('keydown',keyHandler);viewer._returnFocus?.focus?.()};
  const keyHandler=e=>{if(e.key==='Escape')close();else if(e.key==='+')zoom(1.3);else if(e.key==='-')zoom(1/1.3)};
  viewer.querySelector('[data-close]').onclick=close;
  viewer.addEventListener('click',e=>{if(e.target===viewer)close()});
  stage.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:1/1.15)},{passive:false});
  stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)start={x:e.clientX,y:e.clientY};else pinch=null});
  stage.addEventListener('pointermove',e=>{
   if(!pointers.has(e.pointerId))return;
   const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(pointers.size===1&&scale>1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;draw()}
   else if(pointers.size===2){const pts=[...pointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch)zoom(dist/pinch);pinch=dist}
  });
  const end=e=>{pointers.delete(e.pointerId);pinch=null};
  stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
  viewer._activate=(src,alt,focus)=>{viewer._returnFocus=focus;large.src=src;large.alt=alt;scale=1;x=y=0;draw();viewer.hidden=false;document.addEventListener('keydown',keyHandler);viewer.querySelector('[data-close]').focus()};
 }
 viewer._activate(img.currentSrc||img.src,img.alt,img);
}
async function gallery(parent,arr){const grid=el('div',undefined,parent,'grid');for(const pos of ['frente','perfil','costas']){const p=arr.find(x=>norm(x.posicao)===(pos==='perfil'?'perfil':pos)||pos==='perfil'&&norm(x.posicao)==='lado');const cell=el('div',undefined,grid,'card');el('strong',pos==='perfil'?'Lado':pos[0].toUpperCase()+pos.slice(1),cell);if(!p){el('p','Sem fotografia',cell,'muted');continue}try{const img=el('img',undefined,cell,'photo');img.src=await signed(p);img.alt='Foto de '+pos;img.loading='lazy';img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','Ampliar foto de '+pos);img.addEventListener('click',()=>openPhotoViewer(img));img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPhotoViewer(img)}})}catch(e){el('p','Imagem indisponível: '+e.message,cell,'error')}}}
function render(m=mode){root.replaceChildren();notice('');$('title').textContent=({fotos:'Fotografias do Aluno',novo:'Nova Avaliação Fotográfica',solicitar:'Solicitar Fotografias',consultar:'Consultar Fotografias',postural:'Análise Postural',comparar:'Comparar Fotografias',autorizacoes:'Autorizações Fotográficas'})[m]||'Avaliação Fotográfica';back(()=>location.assign('admin.html'+(origin.startsWith('#wc/')?origin:'#wc/fotografica')));
if(m==='fotos'){el('p','Escolha a função desejada. Cada opção abre uma tela independente.',root,'muted');button(root,'Nova Avaliação Fotográfica','Registrar fotografias de frente, lado e costas',()=>goto('novo'),'▣');button(root,'Solicitar Fotografias ao Aluno','Solicitação orientada pelo aplicativo',()=>goto('solicitar'),'➤');button(root,'Consultar Fotografias','Registros organizados por data',()=>goto('consultar'),'▤');return}
if(m==='novo'){back(()=>goto('fotos'));el('p','Registre as imagens padronizadas. Use iluminação uniforme, câmera na altura adequada e posições consistentes.',root,'muted');const consentStatus=el('div','Verificando autorização de uso interno…',root,'card');const form=el('form');form.hidden=true;db.from('consentimentos_fotograficos').select('status_avaliacao').eq('aluno_id',id).eq('status_avaliacao','autorizada').limit(1).then(({data,error})=>{if(error){consentStatus.textContent='Não foi possível consultar o consentimento fotográfico existente no Supabase.';return}if(!data?.length){consentStatus.textContent='É necessária autorização de uso interno do aluno antes do registro fotográfico.';return}consentStatus.remove();form.hidden=false});for(const [pos,label] of [['frente','Frente'],['perfil','Lado'],['costas','Costas']]){const field=el('label',label,form);const input=el('input',undefined,field);input.type='file';input.accept='image/jpeg,image/png,image/webp';input.name=pos}const send=el('button','Registrar fotografias',form);send.type='submit';form.onsubmit=async e=>{e.preventDefault();const inputs=[...form.querySelectorAll('input[type=file]')].filter(x=>x.files.length);if(!inputs.length){notice('Selecione ao menos uma fotografia.',true);return}send.disabled=true;const created=[];try{for(const input of inputs){const file=input.files[0];if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('Use JPG, PNG ou WebP de até 8 MB.');const path=id+'/'+Date.now()+'-'+input.name+'-'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop().toLowerCase();const upload=await db.storage.from('avaliacoes-fotograficas').upload(path,file,{contentType:file.type});if(upload.error)throw upload.error;const inserted=await db.from('fotos_avaliacao').insert({aluno_id:id,posicao:input.name,caminho:path,enviado_por:(await db.auth.getUser()).data.user?.id});if(inserted.error){await db.storage.from('avaliacoes-fotograficas').remove([path]);throw inserted.error}created.push(path)}await load();await wandConclusaoLocal('Fotografias registradas com sucesso.');goto('consultar')}catch(err){notice('Não foi possível concluir o registro: '+err.message,true)}finally{send.disabled=false}};return}
if(m==='solicitar'){
  back(()=>location.assign('admin.html#wc/fotografica'));
  const verificando=el('p','Verificando autorização e solicitação existente…',root,'muted');

  (async()=>{
    try{
      const {data:{user},error:authError}=await db.auth.getUser();

      const {data:consent,error:consentError}=await db.from('consentimentos_fotograficos')

if(m==='comparar'){if(groups().length<2){el('div','São necessários registros fotográficos de pelo menos duas datas para comparar.',root,'card');return}el('p','Escolha duas datas e compare a mesma posição lado a lado.',root,'muted');const dates=groups();const selects=[];for(let i=0;i<2;i++){const label=el('label',i?'Avaliação recente':'Avaliação anterior');const select=el('select',undefined,label);for(const [d] of dates){const option=el('option',day(d),select);option.value=d}select.value=dates[i][0];selects.push(select)}const position=el('label','Posição fotográfica');const selectPos=el('select',undefined,position);for(const [value,label] of [['frente','Frente'],['perfil','Lado'],['costas','Costas']]){const option=el('option',label,selectPos);option.value=value}const output=el('div');const show=async()=>{output.replaceChildren();if(selects[0].value===selects[1].value){el('p','Selecione duas datas diferentes.',output);return}const grid=el('div',undefined,output,'grid');for(const sel of selects){const card=el('div',undefined,grid,'card');el('h2',day(sel.value),card);const arr=dates.find(([d])=>d===sel.value)?.[1]||[];const p=arr.find(x=>norm(x.posicao)===selectPos.value||(selectPos.value==='perfil'&&norm(x.posicao)==='lado'));if(!p){el('p','Sem fotografia nesta posição.',card);continue}try{const img=el('img',undefined,card,'photo');img.src=await signed(p);img.alt='Comparação '+day(sel.value)}catch(e){el('p',e.message,card,'error')}}};[...selects,selectPos].forEach(x=>x.onchange=show);show();return}
if(m==='postural'){el('p','Análise profissional das fotografias, com registro de observações e histórico.',root,'muted');const a=el('a','Abrir Análise Postural',root,'btn');a.href='avaliacao-postural.html?aluno_id='+encodeURIComponent(id)+'&origem='+encodeURIComponent(location.href);return}
if(m==='autorizacoes'){

 (async()=>{

   if(a){
    el('p','Divulgação: '+(a.divulgacao_autorizada?'Autorizada pelo aluno':'Não autorizada')+'.',area,'muted');
    el('p','Última atualização: '+day(a.atualizado_em)+' · Termo '+a.versao_termo,area,'muted');
   }
   if(status==='autorizada')return;
   const {data:pendentes,error:pe}=await db.from('wand_pedidos_autorizacao_foto').select('id,solicitado_em').eq('aluno_id',id).eq('status','pendente').limit(1);
   if(pe)throw pe;
   if(pendentes?.length){el('p','Pedido de autorização já enviado. Aguardando resposta do aluno.',area,'muted');return;}
   const solicitar=el('button','Enviar pedido de autorização',area);
   solicitar.type='button';
   solicitar.style.cssText='display:block;width:100%;margin-top:16px;text-align:center!important;background:linear-gradient(180deg,#fff0b0,#e5bd58 35%,#b17d25)!important;color:#171005!important;border:1px solid #f6d98e!important;border-radius:12px;padding:14px;font-weight:700;box-shadow:inset 0 2px 2px #fff9,0 5px 12px #0009';
   solicitar.onclick=async()=>{
    if(solicitar.disabled)return;
    solicitar.disabled=true;
    try{
     const {data:{user},error:authError}=await db.auth.getUser();
     if(authError||!user)throw Error('Sua sessão expirou.');
     const {error:insertError}=await db.from('wand_pedidos_autorizacao_foto').insert({aluno_id:id,solicitado_por:user.id});
     if(insertError){
      if(insertError.code==='23505'){await wandAvisoFotografico('Pedido já enviado','Já existe uma solicitação de autorização pendente para este aluno.');return;}
      throw insertError;
     }
     solicitar.remove();
     el('p','Pedido enviado. Aguardando o aluno responder nas notificações.',area,'muted');
     await wandConclusaoLocal('Pedido de autorização fotográfica enviado ao aluno com sucesso.');
    }catch(e){
     console.warn('[WAND] Pedido de autorização fotográfica',e);
     await wandAvisoFotografico('Não foi possível enviar','Não foi possível enviar o pedido de autorização. Tente novamente.');
    }finally{solicitar.disabled=false;}
   };
  }catch(e){
   console.warn('[WAND] Consulta de autorizações',e);
   el('p','Não foi possível consultar as autorizações. Tente novamente.',area,'muted');
  }
 })();
 return;
}
