<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliação Fotográfica | WandCoach</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 8%,#5e3a1052,transparent 32%),radial-gradient(ellipse at 5% 65%,#40290942,transparent 43%),#070707;color:#eee;font:15px Arial,sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 125px}h1,h2{color:#f3c95f}h1{font-size:26px}h2{font-size:20px}.muted{color:#bbb;line-height:1.5}.back{display:inline-flex;width:auto!important;background:transparent!important;color:#d4af37!important;border:1px solid #a88b32!important;box-shadow:none!important;border-radius:10px!important;padding:12px 15px!important;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}.card{background:linear-gradient(145deg,#211a11,#121212 50%,#1d160d);border:1px solid #a17c36;border-radius:19px;padding:17px;margin:14px 0;box-shadow:inset 0 1px 1px #ffdb8c45,0 10px 20px #0009}button,.btn{display:block;width:100%;padding:15px 16px;border:1px solid #a17c36;border-radius:13px;background:linear-gradient(145deg,#33220d,#171717);color:#f3c95f;font:inherit;cursor:pointer;text-align:left;text-decoration:none;margin:10px 0}.action{display:flex;align-items:center;gap:14px;min-height:84px;border-radius:19px;background:linear-gradient(145deg,#33220d,#1c1915 28%,#111 70%,#2a1a08);box-shadow:inset 0 2px 1px #ffdb8c73,0 10px 20px #0009}.action-icon{display:grid;place-items:center;width:43px;height:43px;flex:none;border:1px solid #9c7a3e;border-radius:13px;background:linear-gradient(145deg,#594018,#20180c);font-size:23px}.action-body{flex:1;color:#fff}.action-body strong{display:block;font-size:16px}.action-body small{display:block;color:#bbb;font-size:13px;margin-top:5px}.arrow{font-size:24px}select,input,textarea{display:block;width:100%;background:#101010;color:#fff;border:1px solid #75623e;border-radius:10px;padding:12px;font:inherit;margin:8px 0 16px}label{display:block;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.photo{width:100%;aspect-ratio:3/4;object-fit:contain;background:#0b0b0b;border-radius:9px;border:1px solid #5e4b28}.error{color:#ff8585}.success{color:#92dba0}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(96%,600px);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:9px;border:1px solid #ad873c;border-radius:22px;background:linear-gradient(135deg,#21190c,#0e0e0e 55%,#24190b);box-shadow:0 4px 18px #000c}.dock a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:65px;text-decoration:none;color:#eee;border:1px solid #777;border-radius:14px;background:linear-gradient(145deg,#292929,#101010);font-size:12px}.dock a span{font-size:26px}.dock a small{font-size:11px}
</style></head><body><main><a class="back" id="back" href="admin.html#wc/fotografica">← Voltar à Avaliação Fotográfica</a><h1 id="title">Avaliação Fotográfica</h1><p class="muted" id="student"></p><p id="notice" role="status"></p><section id="content"></section></main><nav class="dock" aria-label="Navegação WandCoach"><a href="admin.html"><span>⌂</span><small>Início</small></a><a href="admin.html#wc/alunos"><span>♙</span><small>Alunos</small></a><a href="admin.html#wc/treinos"><span>▤</span><small>Treinos</small></a><a href="admin.html#wc/evolucao"><span>▥</span><small>Evolução</small></a><a href="admin.html#wc/fotografica"><span>☷</span><small>Menu</small></a></nav><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://kvxdnreipuahoaostlle.supabase.co','sb_publishable_8DJWlBHFrh_cULSe3icwJg_t9ZqTBjo');
const qs=new URLSearchParams(location.search),id=Number(qs.get('id')),mode=qs.get('modo')||'fotos',origin=qs.get('origem')||'#wc/fotografica';
const $=x=>document.getElementById(x),root=$('content');let photos=[],consents=[],name='';
const el=(tag,txt,parent,cls)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;(parent||root).append(n);return n};
const button=(parent,title,sub,fn,icon='▣')=>{const b=el('button',undefined,parent,'action');el('span',icon,b,'action-icon');const w=el('span',undefined,b,'action-body');el('strong',title,w);if(sub)el('small',sub,w);el('span','›',b,'arrow');b.onclick=fn;return b};
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const day=v=>v?new Date(v).toLocaleDateString('pt-BR'):'Data não informada';
const back=fn=>{$('back').onclick=e=>{e.preventDefault();fn()}};const notice=(s,error=false)=>{$('notice').textContent=s;$('notice').className=error?'error':'success'};
function goto(m){history.pushState({},'',location.pathname+'?id='+id+'&modo='+m+'&origem='+encodeURIComponent(origin));render(m)}
async function signed(photo){const {data,error}=await db.storage.from('avaliacoes-fotograficas').createSignedUrl(photo.caminho,300);if(error)throw error;return data.signedUrl}
async function load(){const {data,error}=await db.from('fotos_avaliacao').select('*').eq('aluno_id',id).order('criado_em',{ascending:false});if(error)throw error;photos=data||[]}
function groups(){const g=new Map();for(const p of photos){const key=String(p.criado_em||'').slice(0,10)||'Sem data';if(!g.has(key))g.set(key,[]);g.get(key).push(p)}return [...g]}
async function gallery(parent,arr){const grid=el('div',undefined,parent,'grid');for(const pos of ['frente','perfil','costas']){const p=arr.find(x=>norm(x.posicao)===(pos==='perfil'?'perfil':pos)||pos==='perfil'&&norm(x.posicao)==='lado');const cell=el('div',undefined,grid,'card');el('strong',pos==='perfil'?'Lado':pos[0].toUpperCase()+pos.slice(1),cell);if(!p){el('p','Sem fotografia',cell,'muted');continue}try{const img=el('img',undefined,cell,'photo');img.src=await signed(p);img.alt='Foto de '+pos;img.loading='lazy'}catch(e){el('p','Imagem indisponível: '+e.message,cell,'error')}}}
function render(m=mode){root.replaceChildren();notice('');$('title').textContent=({fotos:'Fotografias do Aluno',novo:'Nova Avaliação Fotográfica',solicitar:'Solicitar Fotografias',consultar:'Consultar Fotografias',postural:'Análise Postural',comparar:'Comparar Fotografias',autorizacoes:'Autorizações Fotográficas'})[m]||'Avaliação Fotográfica';back(()=>location.assign('admin.html'+(origin.startsWith('#wc/')?origin:'#wc/fotografica')));
if(m==='fotos'){el('p','Escolha a função desejada. Cada opção abre uma tela independente.',root,'muted');button(root,'Nova Avaliação Fotográfica','Registrar fotografias de frente, lado e costas',()=>goto('novo'),'▣');button(root,'Solicitar Fotografias ao Aluno','Solicitação orientada pelo aplicativo',()=>goto('solicitar'),'➤');button(root,'Consultar Fotografias','Registros organizados por data',()=>goto('consultar'),'▤');return}
if(m==='novo'){back(()=>goto('fotos'));el('p','Registre as imagens padronizadas. Use iluminação uniforme, câmera na altura adequada e posições consistentes.',root,'muted');const consentStatus=el('div','Verificando autorização de uso interno…',root,'card');const form=el('form');form.hidden=true;db.from('consentimentos_fotograficos').select('status_avaliacao').eq('aluno_id',id).eq('status_avaliacao','autorizada').limit(1).then(({data,error})=>{if(error){consentStatus.textContent='Não foi possível consultar o consentimento fotográfico existente no Supabase.';return}if(!data?.length){consentStatus.textContent='É necessária autorização de uso interno do aluno antes do registro fotográfico.';return}consentStatus.remove();form.hidden=false});for(const [pos,label] of [['frente','Frente'],['perfil','Lado'],['costas','Costas']]){const field=el('label',label,form);const input=el('input',undefined,field);input.type='file';input.accept='image/jpeg,image/png,image/webp';input.name=pos}const send=el('button','Registrar fotografias',form);send.type='submit';form.onsubmit=async e=>{e.preventDefault();const inputs=[...form.querySelectorAll('input[type=file]')].filter(x=>x.files.length);if(!inputs.length){notice('Selecione ao menos uma fotografia.',true);return}send.disabled=true;const created=[];try{for(const input of inputs){const file=input.files[0];if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('Use JPG, PNG ou WebP de até 8 MB.');const path=id+'/'+Date.now()+'-'+input.name+'-'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop().toLowerCase();const upload=await db.storage.from('avaliacoes-fotograficas').upload(path,file,{contentType:file.type});if(upload.error)throw upload.error;const inserted=await db.from('fotos_avaliacao').insert({aluno_id:id,posicao:input.name,caminho:path,enviado_por:(await db.auth.getUser()).data.user?.id});if(inserted.error){await db.storage.from('avaliacoes-fotograficas').remove([path]);throw inserted.error}created.push(path)}await load();notice('Fotografias registradas com sucesso.');goto('consultar')}catch(err){notice('Não foi possível concluir o registro: '+err.message,true)}finally{send.disabled=false}};return}
if(m==='solicitar'){
  back(()=>location.assign('admin.html#wc/fotografica'));
  el('p','Verificando autorização e solicitação existente…',root,'muted');
  const area=el('div','Aguarde…',root,'card');
  const show=(message,isError=false)=>{
    area.replaceChildren();
    el('h2',message,area,isError?'error':'success');

  };
  (async()=>{
    try{
      const {data:{user},error:authError}=await db.auth.getUser();
      if(authError||!user)throw Error('Sessão expirada. Entre novamente.');
      const {data:consent,error:consentError}=await db.from('consentimentos_fotograficos')
        .select('status_avaliacao').eq('aluno_id',id).maybeSingle();
      if(consentError)throw Error('Não foi possível verificar a autorização do aluno.');
      if(consent?.status_avaliacao!=='autorizada'){
        show('Aluno não autorizou a avaliação fotográfica. Entre em contato com ele para solicitar a autorização.',true);
        return;
      }
      const {data:pedidos,error:pedidoError}=await db.from('wand_solicitacoes_fotograficas')
        .select('id').eq('aluno_id',id).eq('status','pendente').limit(1);
      if(pedidoError)throw pedidoError;
      if(pedidos?.length){show('Este aluno já possui uma solicitação fotográfica pendente.');return;}
      const {error:insertError}=await db.from('wand_solicitacoes_fotograficas')
        .insert({aluno_id:id,solicitado_por:user.id,status:'pendente',orientacoes:null});
      if(insertError){
        // Outra sessão pode ter criado a solicitação simultaneamente.
        const {data:existentes}=await db.from('wand_solicitacoes_fotograficas')
          .select('id').eq('aluno_id',id).eq('status','pendente').limit(1);
        if(existentes?.length){show('Este aluno já possui uma solicitação fotográfica pendente.');return;}
        throw insertError;
      }
      show('Fotografia solicitada com sucesso!');
    }catch(e){show('Não foi possível solicitar fotografias: '+e.message,true);}
  })();
  return;
}
if(m==='consultar'){back(()=>goto('fotos'));if(!photos.length){el('div','Nenhuma fotografia cadastrada para este aluno.',root,'card');return}for(const [date,arr] of groups())button(root,day(date),'Abrir fotografias registradas nesta data',async()=>{root.replaceChildren();$('title').textContent='Fotografias · '+day(date);back(()=>render('consultar'));await gallery(root,arr)},'▤');return}
if(m==='comparar'){if(groups().length<2){el('div','São necessários registros fotográficos de pelo menos duas datas para comparar.',root,'card');return}el('p','Escolha duas datas e compare a mesma posição lado a lado.',root,'muted');const dates=groups();const selects=[];for(let i=0;i<2;i++){const label=el('label',i?'Avaliação recente':'Avaliação anterior');const select=el('select',undefined,label);for(const [d] of dates){const option=el('option',day(d),select);option.value=d}select.value=dates[i][0];selects.push(select)}const position=el('label','Posição fotográfica');const selectPos=el('select',undefined,position);for(const [value,label] of [['frente','Frente'],['perfil','Lado'],['costas','Costas']]){const option=el('option',label,selectPos);option.value=value}const output=el('div');const show=async()=>{output.replaceChildren();if(selects[0].value===selects[1].value){el('p','Selecione duas datas diferentes.',output);return}const grid=el('div',undefined,output,'grid');for(const sel of selects){const card=el('div',undefined,grid,'card');el('h2',day(sel.value),card);const arr=dates.find(([d])=>d===sel.value)?.[1]||[];const p=arr.find(x=>norm(x.posicao)===selectPos.value||(selectPos.value==='perfil'&&norm(x.posicao)==='lado'));if(!p){el('p','Sem fotografia nesta posição.',card);continue}try{const img=el('img',undefined,card,'photo');img.src=await signed(p);img.alt='Comparação '+day(sel.value)}catch(e){el('p',e.message,card,'error')}}};[...selects,selectPos].forEach(x=>x.onchange=show);show();return}
if(m==='postural'){el('p','Análise profissional das fotografias, com registro de observações e histórico.',root,'muted');const a=el('a','Abrir Análise Postural',root,'btn');a.href='avaliacao-postural.html?aluno_id='+encodeURIComponent(id)+'&origem='+encodeURIComponent(location.href);return}
if(m==='autorizacoes'){el('p','Consentimento para avaliação e autorização de divulgação são permissões diferentes. O uso externo deve ser opcional e específico.',root,'muted');const area=el('div','Consultando consentimentos…',root,'card');db.from('consentimentos_fotograficos').select('aluno_id,status_avaliacao,divulgacao_autorizada,versao_termo,atualizado_em').eq('aluno_id',id).then(({data,error})=>{area.replaceChildren();if(error){el('p','Não foi possível consultar o consentimento fotográfico. Nenhuma autorização foi presumida.',area,'muted');return}if(!data?.length){el('p','Nenhuma autorização registrada.',area);return}for(const a of data){for(const [titulo,estado] of [['Avaliação',a.status_avaliacao==='autorizada'?'Autorizada':a.status_avaliacao==='recusada'?'Recusada':'Pendente'],['Divulgação',a.divulgacao_autorizada?'Autorizada':'Não autorizada']]){const item=el('div',undefined,area,'card');el('strong',titulo+' · '+estado,item);el('p','Última atualização: '+day(a.atualizado_em)+' · Termo '+a.versao_termo,item,'muted')}}});return}}
async function init(){try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('Entre no WandCoach.');const {data:p,error:pe}=await db.from('profiles').select('role').eq('id',user.id).single();if(pe||p?.role!=='admin')throw Error('Acesso exclusivo do treinador.');if(!Number.isSafeInteger(id)||id<1)throw Error('Aluno inválido.');const {data:a,error}=await db.from('alunos').select('nome_completo').eq('id',id).single();if(error)throw error;name=a.nome_completo;$('student').textContent=name;await load();render()}catch(e){notice('Não foi possível carregar: '+e.message,true)}}
window.onpopstate=()=>render(new URLSearchParams(location.search).get('modo')||'fotos');init();
</script></body></html>
